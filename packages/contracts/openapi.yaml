        catchUp:
          type: object
          properties:
            active: { type: boolean }
            multiplierBp: { type: integer }
        resetsAt: { type: string, format: date-time }
    CultivationSnapshot:
      type: object
      properties:
        stageId: { type: string, example: luyen_hu.so_ky_2 }
        path: { type: string, enum: [tien, vu] }
        tier: { type: integer }
        cultivationMilli: { type: integer, format: int64, description: stored in the current stage }
        requiredMilli: { type: integer, format: int64 }
        capMilli: { type: integer, format: int64, description: "> 0 only on a realm's last stage (bình cảnh)" }
        bottleneckRoomMilli: { type: integer, format: int64 }
        grantReserveMilli: { type: integer, format: int64 }
        idleRateMilliPerHour: { type: integer, format: int64 }
        offlineCapSeconds: { type: integer }
        lastCultivatedAt: { type: string, format: date-time }
        today: { $ref: "#/components/schemas/Today" }
    CharacterView:
      allOf:
        - $ref: "#/components/schemas/CultivationSnapshot"
        - type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            createdAt: { type: string, format: date-time }
            realmId: { type: string }
            failStreak: { type: integer }
            cooldownUntil: { type: [string, "null"], format: date-time }
            stageReachedAt: { type: string, format: date-time }
            offlineBonusSeconds: { type: integer }
            bonusUsedToday: { type: boolean }
            factionId: { type: [string, "null"], description: null = no faction yet (web sends them to the faction step) }
            appearance: { $ref: "#/components/schemas/Appearance" }
            replayed: { type: boolean, description: only on an onboarding replay }
    OddsPart:
      type: object
      description: >-
        One disclosed component. For a non-guaranteed tribulation the parts sum to successBp: bonus parts uncapped, then
        bonus_cap (≤ 0, decision-F total-bonus cap) and max_cap (≤ 0, final cap); a guaranteed attempt adds guarantee.
      properties:
        source: { type: string, enum: [base, pity, surplus, items, protector, bonus_cap, max_cap, guarantee] }
        bp: { type: integer }
        detail: { type: string, description: "items: the equipped pháp bảo id; protector: counted members" }
    OddsCaps:
      type: object
      description: Decision-F caps and bonus sources of a tribulation (Phase 3.4).
      properties:
        surplusMaxBp: { type: integer }
        itemMaxBp: { type: integer }
        protectorPerMemberBp: { type: integer }
        protectorMaxBp: { type: integer }
        totalBonusMaxBp: { type: integer }
        maxSuccessBp: { type: integer }
        artifactId: { type: string, description: equipped pháp bảo counted in items ("" = none) }
        artifactBonusBp: { type: integer }
        protectorMembers: { type: integer, description: protectors that count now (online, same faction, accepted) }
    BreakthroughPreview:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        kind: { type: string, enum: [major] }
        ready: { type: boolean }
        settlementIncluded: { type: boolean }
        projectedCultivationMilli: { type: integer, format: int64 }
        successBp: { type: integer }
        odds: { type: array, items: { $ref: "#/components/schemas/OddsPart" } }
        caps: { $ref: "#/components/schemas/OddsCaps" }
        cooldownSeconds: { type: integer }
        consumes: { type: array, items: { type: object } }
        tribulation:
          type: object
          properties:
            name: { type: string }
            guaranteed: { type: boolean }
            failStreak: { type: integer }
            guaranteeAfter: { type: integer }
            lossBp: { type: integer }
            lossMilli: { type: integer, format: int64, description: loss if attempted now (display) }
            maxLossMilli:
              type: integer
              format: int64
              description: >-
                Guard bound to send as acceptLossMilli: the loss after realms.yaml tribulation.quote_window_seconds of
                further idle accrual (capped by bình cảnh). ≥ lossMilli.
            cooldownSeconds: { type: integer }
        trial:
          description: Present when a mini-game trial gates this breakthrough (trials.yaml gate.tier).
          type: object
          properties:
            kind: { type: string, example: tam_ma }
            name: { type: string }
            passed: { type: boolean }
            validUntil: { type: [string, "null"], format: date-time, description: expiry of the valid pass; null when none }
        missing:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [cultivation, item, trial, cooldown, final_stage] }
              itemId: { type: string }
              trialKind: { type: string, description: "kind trial: the trials.yaml kind whose valid pass is needed (tam_ma | hoa_pham)" }
              have: { type: integer, description: "cultivation: milli from the start of the realm" }
              need: { type: integer }
              readyAt: { type: string, format: date-time }
    TamMaParams:
      type: object
      description: Tâm Ma rules snapshot (trials.yaml params, camelCase). The run's copy is what the server replays.
      properties:
        rulesVersion: { type: integer }
        tickMs: { type: integer }
        width: { type: integer }
        height: { type: integer }
        timeLimitTicks: { type: integer }
        passLines: { type: integer }
        gravity: { type: object, properties: { startTicks: { type: integer }, minTicks: { type: integer }, stepEveryTicks: { type: integer } } }
        riseEveryTicks: { type: integer }
        calm: { type: object, properties: { chargePerLine: { type: integer }, chargeMax: { type: integer }, durationTicks: { type: integer } } }
        lineScores: { type: array, items: { type: integer } }
        maxInputs: { type: integer }
        inputWindowTicks: { type: integer, description: "rules v2: window for the input cadence cap" }
        maxInputsPerWindow: { type: integer, description: "more inputs in any window → rejected implausible_input" }
        minLockGapTicks: { type: integer, description: "a drop sooner than this after the previous lock is ignored (game rule)" }
        minPassTicks: { type: integer, description: "the pass needs passLines AND tick ≥ minPassTicks" }
        minElapsedBp: { type: integer, description: "kind-level snapshot: submit needs server elapsed ≥ game time × this / 10000" }
        pieces:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              weight: { type: integer }
              cells: { type: array, items: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 } }
    HoaPhamParams:
      type: object
      description: >-
        Hóa Phàm rules snapshot (trials.yaml params, camelCase; docs/design/hoa-pham-luat-choi.md). Field in grid units,
        motion in 1/32 grid units per tick. The run's copy is what the server replays.
      properties:
        rulesVersion: { type: integer }
        tickMs: { type: integer }
        width: { type: integer }
        height: { type: integer }
        timeLimitTicks: { type: integer }
        passScore: { type: integer }
        minPassTicks: { type: integer, description: "the pass needs passScore AND tick ≥ minPassTicks" }
        lanterns: { type: integer, description: "tâm đăng: cutting this many chân tâm lanterns fails" }
        gravitySub: { type: integer }
        knotMotion: { type: object, properties: { vySub: { type: object, properties: { min: { type: integer }, max: { type: integer } } }, vxMaxSub: { type: integer } } }
        lanternMotion: { type: object, properties: { vySub: { type: object, properties: { min: { type: integer }, max: { type: integer } } }, vxMaxSub: { type: integer } } }
        spawn:
          type: object
          properties:
            startTicks: { type: integer }
            minTicks: { type: integer }
            stepEveryTicks: { type: integer }
            waveMax: { type: integer }
            waveGrowEveryTicks: { type: integer }
            margin: { type: integer }
        minCutStep: { type: integer, description: a segment shorter than this (octile grid units per tick) cuts nothing }
        combo: { type: object, properties: { stepBonus: { type: integer }, maxBonus: { type: integer } } }
        calm: { type: object, properties: { chargePerCut: { type: integer }, chargeMax: { type: integer }, durationTicks: { type: integer } } }
        maxStrokes: { type: integer }
        maxStep: { type: integer, description: "the brush follows the pointer ≤ maxStep units per tick; longer = implausible_input" }
        inputWindowTicks: { type: integer }
        maxWindowTravel: { type: integer, description: more brush travel in any window → implausible_input }
        maxStrokesPerWindow: { type: integer, description: more stroke starts in any window → implausible_input }
        minLiftTicks: { type: integer, description: unpressed ticks required between two strokes }
        minElapsedBp: { type: integer, description: "kind-level snapshot: submit needs server elapsed ≥ game time × this / 10000" }
        objects:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              role: { type: string, enum: [knot, lantern] }
              weight: { type: integer }
              radius: { type: integer }
              points: { type: integer }
              hp: { type: integer }
    TrialParams:
      description: Params of the kind's engine (tam_ma → TamMaParams, hoa_pham → HoaPhamParams).
      oneOf:
        - { $ref: "#/components/schemas/TamMaParams" }
        - { $ref: "#/components/schemas/HoaPhamParams" }
    TrialKindStatus:
      type: object
      properties:
        kind: { type: string }
        name: { type: string }
        summary: { type: string }
        state: { type: string, enum: [available, in_progress, cooldown, passed, locked] }
        eligible: { type: boolean }
        gateTier: { type: integer }
        fromRealmId: { type: string }
        toRealmId: { type: string }
        opensAt: { type: string, enum: [last_stage, realm] }
        cooldownUntil: { type: [string, "null"], format: date-time }
        pass: { type: [object, "null"], properties: { runId: { type: string, format: uuid }, validUntil: { type: string, format: date-time } } }
        openRun: { type: [object, "null"], properties: { runId: { type: string, format: uuid }, expiresAt: { type: string, format: date-time } } }
        loseCooldownSeconds: { type: integer }
        passValidSeconds: { type: integer }
        expireAfterSeconds: { type: integer }
        params: { $ref: "#/components/schemas/TrialParams" }
    TrialStatus:
      type: object
      properties:
        serverNow: { type: string, format: date-time }
        kinds: { type: array, items: { $ref: "#/components/schemas/TrialKindStatus" } }
    TrialRunStart:
      type: object
      properties:
        runId: { type: string, format: uuid }
        kind: { type: string }
        seed: { type: integer, format: int64, minimum: 1, maximum: 4294967295 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        serverNow: { type: string, format: date-time }
        params: { $ref: "#/components/schemas/TrialParams" }
        resumed: { type: boolean }
        status: { $ref: "#/components/schemas/TrialKindStatus" }
    TrialClaim:
      type: object
      required: [endTick, lines, score, stateHash, inputs]
      description: >-
        The input log plus the end state the client's simulator reached. Only the log decides; the rest must equal
        the server replay. Tâm ma: `inputs` = [tick, action], action 1 left · 2 right · 3 rotate cw · 4 rotate ccw ·
        5 soft drop · 6 hard drop · 7 tĩnh tâm; `lines` = rows cleared. Hóa phàm: `strokes` = one array per pressed
        period [start, x0, y0, dx1, dy1, …] (grid units, one point per tick), `inputs` empty, `lines` = knots severed.
        The body limit is 96 KiB (the catalogue loader checks the longest log of every kind fits).
      properties:
        endTick: { type: integer, minimum: 1 }
        lines: { type: integer }
        score: { type: integer }
        stateHash: { type: integer, format: int64, description: FNV-1a 32 of the canonical end state }
        inputs: { type: array, items: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 } }
        strokes: { type: array, items: { type: array, items: { type: integer }, minItems: 3 }, description: "hóa phàm stroke log" }
    SecretRealmLoot:
      type: object
      properties:
        band: { type: string }
        spiritStone: { type: integer, format: int64, description: granted after the daily cap }
        items: { type: array, items: { type: object, properties: { itemId: { type: string }, quantity: { type: integer } } } }
        artifact: { type: string, description: pháp bảo granted }
        duplicateOf: { type: string, description: rolled pháp bảo already owned → duplicate stones }
        artifactChanceBp: { type: integer }
        rolledSpiritStone: { type: integer, format: int64 }
        rolledItems: { type: array, items: { type: object, properties: { itemId: { type: string }, quantity: { type: integer } } } }
        rolledArtifact: { type: string }
        clipped: { type: boolean }
        artifactCapped: { type: boolean }
    SecretRealmStatus:
      type: object
      properties:
        realmId: { type: string }
        name: { type: string }
        summary: { type: string }
        unlocked: { type: boolean }
        minTier: { type: integer }
        runsPerDay: { type: integer }
        runsLeft: { type: integer }
        expireAfterSeconds: { type: integer }
        minRewardTicks: { type: integer }
        bands: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, minScore: { type: integer } } } }
        loot: { type: object, additionalProperties: { type: object } }
        survived: { type: object, properties: { spiritStone: { type: integer }, artifactChanceBp: { type: integer } } }
        artifacts: { type: array, items: { type: object, properties: { itemId: { type: string }, weight: { type: integer }, duplicateStones: { type: integer } } } }
        dailyCaps: { type: object, properties: { spiritStone: { type: integer }, materials: { type: integer }, artifacts: { type: integer } } }
        today: { type: object }
        resetAt: { type: string, format: date-time }
        openRun: { type: [object, "null"] }
        params: { type: object, description: "bí cảnh rules snapshot (rules v1, camelCase; see lib/game/types.ts BiCanhParams)" }
    SecretRealmView:
      type: object
      properties:
        serverNow: { type: string, format: date-time }
        realms: { type: array, items: { $ref: "#/components/schemas/SecretRealmStatus" } }
        recent: { type: array, items: { type: object } }
    SecretRealmStart:
      type: object
      properties:
        runId: { type: string, format: uuid }
        realmId: { type: string }
        seed: { type: integer, format: int64 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        serverNow: { type: string, format: date-time }
        params: { type: object }
        resumed: { type: boolean }
        status: { $ref: "#/components/schemas/SecretRealmStatus" }
    SecretRealmClaim:
      type: object
      required: [endTick, kills, score, stateHash, moves]
      properties:
        endTick: { type: integer }
        kills: { type: integer }
        score: { type: integer }
        stateHash: { type: integer, format: int64 }
        moves:
          type: array
          description: RLE [direction 0..8 (0 still, 1..8 N,NE,E,SE,S,SW,W,NW), ticks ≥ 1]; consecutive directions differ; Σ ticks = endTick
          items: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
    SecretRealmSubmit:
      type: object
      properties:
        runId: { type: string, format: uuid }
        realmId: { type: string }
        verdict: { type: string, enum: [pass, fail, rejected, expired] }
        reason: { type: string }
        outcome: { type: [object, "null"], description: replay result + cadence telemetry (pass/fail only) }
        band: { type: [object, "null"] }
        loot: { oneOf: [{ $ref: "#/components/schemas/SecretRealmLoot" }, { type: "null" }] }
        vipPoints: { type: integer }
        replayed: { type: boolean }
        status: { $ref: "#/components/schemas/SecretRealmStatus" }
    EquippedArtifact:
      type: object
      properties:
        itemId: { type: string, description: '"" = none' }
        tribulationBonusBp: { type: integer }
        equippedAt: { type: [string, "null"], format: date-time }
    ProtectorView:
      type: object
      properties:
        serverNow: { type: string, format: date-time }
        factionId: { type: string }
        eligible: { type: boolean }
        pingEverySeconds: { type: integer }
        inviteWindowSeconds: { type: integer }
        dailyAssists: { type: integer }
        assistsLeft: { type: integer }
        maxCounted: { type: integer }
        perMemberBp: { type: integer }
        maxBp: { type: integer }
        myInvite: { type: [object, "null"] }
        openInvites: { type: array, items: { type: object } }
        onlineMembers: { type: array, items: { type: object } }
        online: { type: boolean }
    TrialSubmitResult:
      type: object
      properties:
        runId: { type: string, format: uuid }
        kind: { type: string }
        verdict: { type: string, enum: [pass, fail, rejected, expired] }
        reason:
          type: string
          enum: [cleared, topped_out, lanterns_out, time_up, gave_up, late, abandoned, invalid_log, implausible_score, implausible_input, too_fast, mismatch]
        outcome:
          type: [object, "null"]
          description: the server replay — only for pass/fail verdicts (rejections keep it server-side for audit)
          properties:
            won: { type: boolean }
            reason: { type: string }
            endTick: { type: integer }
            gameMillis: { type: integer }
            lines: { type: integer }
            score: { type: integer }
            pieces: { type: integer }
            stateHash: { type: integer, format: int64 }
            inputs: { type: integer }
            inputsPerSecMilli: { type: integer, description: inputs per second × 1000 over the simulated time }
            maxWindowInputs: { type: integer }
            minLockGapTicks: { type: integer }
            claimedEndTick: { type: integer }
            strokes: { type: integer, description: "hóa phàm telemetry (inputs = pointer samples, lines = knots severed, pieces = spawned)" }
            maxStep: { type: integer }
            maxWindowTravel: { type: integer }
            maxWindowStrokes: { type: integer }
            lanternsCut: { type: integer }
            escaped: { type: integer }
            bestCombo: { type: integer }
            elapsedMillis: { type: integer, description: server ms from issue to submit (hóa phàm) }
            slowSubmit: { type: boolean, description: "elapsed > game time + 60 s: possible replay of a known seed (review flag, never a rejection)" }
        passValidUntil: { type: [string, "null"], format: date-time }
        cooldownUntil: { type: [string, "null"], format: date-time }
        vipPoints: { type: integer, description: điểm duyên credited for this pass (0 when capped or not a pass) }
        replayed: { type: boolean }
        status: { $ref: "#/components/schemas/TrialKindStatus" }
    BreakthroughResult:
      type: object
      properties:
        success: { type: boolean }
        kind: { type: string, enum: [major] }
        from: { type: string }
        to: { type: string }
        successBp: { type: integer }
        consumed: { type: [array, "null"], items: { type: object } }
        tribulation: { type: boolean }
        trialConsumed: { type: string, description: trial kind whose pass this successful breakthrough consumed }
        guaranteed: { type: boolean }
        lossMilli: { type: integer, format: int64 }
        stageId: { type: string }
        cultivationMilli: { type: integer, format: int64 }
        stagesAdvanced: { type: array, items: { type: string } }
        failStreak: { type: integer }
        cooldownUntil: { type: [string, "null"], format: date-time }
        replayed: { type: boolean }
    Stage:
      type: object
      required: [id, realmId, path, tier, name, stageOrder, stageCount, index, requiredMilli, capMilli, cumulativeBeforeMilli, breakthrough]
      properties:
        id: { type: string, example: luyen_khi.tang_3 }
        realmId: { type: string }
        path: { type: string, enum: [tien, vu] }
        tier: { type: integer }
        name: { type: string }
        stageOrder: { type: integer }
        stageCount: { type: integer }
        index: { type: integer, description: 0-based ordinal within the path (-1 for reserved tiers) }
        requiredMilli: { type: integer, format: int64 }
        capMilli: { type: integer, format: int64 }
        cumulativeBeforeMilli: { type: integer, format: int64 }
        nextKind: { type: string, enum: [auto, major] }
        tribulation: { type: boolean }
        reserved: { type: boolean }
        breakthrough:
          type: object
          properties:
            successBp: { type: integer, minimum: 0, maximum: 10000 }
            pityStepBp: { type: integer }
            cooldownSeconds: { type: integer }
            requirements:
              type: [array, "null"]
              items:
                type: object
                properties:
                  itemId: { type: string }
                  quantity: { type: integer }
    Realm:
      type: object
      properties:
        id: { type: string }
        path: { type: string, enum: [tien, vu] }
        tier: { type: integer }
        name: { type: string }
        namePlaceholder: { type: boolean }
        title: { type: string }
        reserved: { type: boolean }
        visual:
          type: object
          properties:
            badge: { type: string }
            aura: { type: string, description: "design token --color-aura-<aura> (Vu: vu-ember … vu-ancestral, one per effect tier)" }
            fxTier:
              type: integer
              minimum: 1
              maximum: 6
              description: >-
                effect tier of the realm's tier (realms.yaml tiers[].visual.fx_tier; both paths share it). Display only:
                celebration size, persistent aura, formation, sound.
        stages: { type: array, items: { $ref: "#/components/schemas/Stage" } }
    RealmCatalogue:
      type: object
      properties:
        version: { type: integer }
        settings:
          type: object
          properties:
            overflowCapBp: { type: integer }
            pityMaxBonusBp: { type: integer }
        paths:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              default: { type: boolean }
              namePlaceholder: { type: boolean }
        tribulation: { type: object, description: "realms.yaml tribulation block (camelCase)" }
        realms: { type: array, items: { $ref: "#/components/schemas/Realm" } }
    CultivationStatus:
      allOf:
        - $ref: "#/components/schemas/CultivationSnapshot"
        - type: object
          properties:
            earnedMilli: { type: integer, format: int64, description: credited by this settlement }
            rawMilli: { type: integer, format: int64, description: idle amount before caps }
            stagesAdvanced: { type: array, items: { type: string } }
            hitOfflineCap: { type: boolean }
            hitDailyCap: { type: boolean }
            hitBottleneck: { type: boolean }
            replayed: { type: boolean }
    # ───── cosmetics & faction works (decisions 2026-11-07 "Linh thạch sinks"; no gameplay effect) ─────
    Appearance:
      type: object
      description: Equipped look, ids only ("<kind>:<slug>"); absent/"" = empty slot.
      required: [caveDecorationIds]
      properties:
        titleId: { type: string }
        avatarFrameId: { type: string }
        chatAuraId: { type: string }
        caveDecorationIds: { type: array, items: { type: string } }
        look:
          $ref: "#/components/schemas/Look"
          description: >-
            Response: the look shown for the character's current path (always present when appearances are served).
            Equip request: optional — absent keeps the current look.
    WorldAnnouncement:
      type: object
      required: [id, kind, tier, characterName, tribulation, text, createdAt]
      properties:
        id: { type: integer, format: int64, description: history row id (= WS envelope id) }
        kind: { type: string, enum: [realm, tribulation, first_to_realm, rank_top10, digest] }
        tier: { type: integer, minimum: 0, maximum: 6, description: effect tier of the realm (0 = none, e.g. rank news) }
        characterId: { type: string, format: uuid }
        characterName: { type: string, description: đạo hiệu (digest — the first of the folded) }
        realmId: { type: string }
        stageId: { type: string }
        path: { type: string }
        tribulation: { type: boolean }
        rank: { type: integer }
        count: { type: integer, description: "digest: how many others" }
        text: { type: string, maxLength: 90 }
        createdAt: { type: string, format: date-time }
    TutorialLine:
      type: object
      required: [expr, text]
      properties:
        expr: { type: string, enum: [neutral, smile, point, worried, proud, surprised], description: "art slot characters/guide/<expr>" }
        text: { type: string, maxLength: 200 }
        spotlight: { type: string, description: 'data-tutorial="<id>" UI target to highlight' }
    TutorialStep:
      type: object
      required: [id, flow, trigger, title, lines]
      properties:
        id: { type: string }
        flow: { type: string, enum: [onboarding, play], description: onboarding = client-only (no character yet); play = stored }
        trigger:
          type: string
          description: >-
            onboarding.<step> | play.enter | fx.settled | fx.stage_up | fx.realm_reached | breakthrough.ready |
            breakthrough.tribulation | window.faction | window.vip | window.companion | window.inventory.shop |
            scene.tu_tieu_cung | mode.trial — server facts (fxBus after a server answer, server previews) or places the
            player opened; never client guesses.
        title: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/TutorialLine" } }
    TutorialScript:
      type: object
      required: [guide, name, steps]
      properties:
        guide: { type: string, example: van_khe }
        name: { type: string, example: Vân Khê }
        steps: { type: array, items: { $ref: "#/components/schemas/TutorialStep" } }
    TutorialState:
      type: object
      required: [done, skipped, muted]
      properties:
        done: { type: array, items: { type: string } }
        skipped: { type: array, items: { type: string } }
        muted: { type: boolean, description: '"không nhắc lại"' }
    TutorialMarkResult:
      type: object
      required: [replayed, state]
      properties:
        replayed: { type: boolean }
        state: { $ref: "#/components/schemas/TutorialState" }
    Look:
      type: object
      description: >-
        Body + painted outfit + meditation pose (content/catalog/appearances.yaml; decisions 2026-11-09 "Ngoại hình…" and
        "Bộ trang phục vẽ sẵn…"). Hair accessory and robe colour are the outfit's parts, derived by the server.
        Responses always carry every field (resolved for the current path). Requests send bodyId + outfitId + poseId;
        hairId/robePaletteId are then ignored (an older client may send them instead of outfitId — they must be the
        parts of one outfit of that body). An outfit of another body, or parts matching no outfit, = 400 unknown_look.
        Display only — never changes tu vi, odds, rank or điểm duyên.
      required: [bodyId, poseId]
      properties:
        bodyId: { type: string, example: tien_nu_y_su }
        outfitId: { type: string, example: y_su_tu_yen, description: "one of the body's outfits (always present in responses)" }
        hairId: { type: string, example: day_lua, description: "derived from the outfit (always present in responses)" }
        robePaletteId: { type: string, example: tu, description: "derived from the outfit; web token --color-robe-<id>" }
        poseId: { type: string, example: ban_gia }
    AppearanceCatalog:
      type: object
      required: [settings, bodies, hairAccessories, robePalettes, poses]
      properties:
        settings: { type: object, properties: { bodyChangeCooldownSeconds: { type: integer, format: int64 } } }
        bodies:
          type: array
          items:
            type: object
            required: [id, path, sex, name, svgHair, defaultHair, defaultRobe, defaultOutfit, defaultPose, pair, defaultFree, outfits]
            properties:
              id: { type: string }
              path: { type: string, enum: [tien, vu] }
              sex: { type: string, enum: [nam, nu] }
              name: { type: string }
              temperament: { type: string }
              traits: { type: string }
              svgHair: { type: string, description: hairstyle of the SVG fallback figure }
              beard: { type: boolean }
              defaultHair: { type: string, description: hair accessory of defaultOutfit }
              defaultRobe: { type: string, description: robe colour of defaultOutfit }
              defaultOutfit: { type: string }
              defaultPose: { type: string }
              outfits:
                type: array
                description: exactly 3 painted outfits (art slots characters/<bodyId>[/<outfitId>]/…)
                items:
                  type: object
                  required: [id, name, robePaletteId, hairId]
                  properties:
                    id: { type: string, example: y_su_tu_yen }
                    name: { type: string, example: Tử Yên Linh Thảo }
                    robePaletteId: { type: string }
                    hairId: { type: string }
              pair: { type: string, description: same-sex body on the other path (shown after a path change) }
              defaultFree: { type: boolean }
        hairAccessories: { type: array, items: { $ref: "#/components/schemas/LookOption" } }
        robePalettes: { type: array, items: { $ref: "#/components/schemas/LookOption" } }
        poses:
          type: array
          items:
            type: object
            properties: { id: { type: string }, name: { type: string }, path: { type: string }, defaultFree: { type: boolean } }
    LookOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        paths: { type: array, items: { type: string } }
        defaultFree: { type: boolean }
    Cosmetic:
      type: object
      required: [id, slug, kind, series, name, rarity, source]
      properties:
        id: { type: string, example: "avatar_frame:ngoc_bich" }
        slug: { type: string }
        kind: { type: string, enum: [title, avatar_frame, chat_aura, cave_decoration] }
        series: { type: string }
        name: { type: string }
        rarity: { type: string, enum: [pham, linh, huyen, dia, thien, tien] }
        source: { type: string, enum: [shop, tien_duyen] }
        price: { type: integer, format: int64, description: spirit stones (shop only) }
        minTier: { type: integer, description: Tiên Duyên level needed to buy (cosmetics only) }
        perkTier: { type: integer, description: Tiên Duyên level that grants it (tien_duyen) }
        description: { type: string }
        season: { type: string }
        fromEra: { type: string }
        untilEra: { type: string }
    CosmeticCatalog:
      type: object
      required: [settings, seasons, series, cosmetics]
      properties:
        settings:
          type: object
          properties: { currency: { type: string }, caveSlots: { type: integer } }
        seasons:
          type: array
          items: { type: object, properties: { id: { type: string }, name: { type: string }, months: { type: array, items: { type: integer } } } }
        series:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string }
              name: { type: string }
              source: { type: string }
              season: { type: string }
              fromEra: { type: string }
              untilEra: { type: string }
              items: { type: array, items: { type: string } }
        cosmetics: { type: array, items: { $ref: "#/components/schemas/Cosmetic" } }
        appearances: { $ref: "#/components/schemas/AppearanceCatalog" }
    CosmeticsView:
      type: object
      required: [balance, tier, season, eraId, owned, available, equipped]
      properties:
        balance: { type: integer, format: int64 }
        tier: { type: integer }
        season: { type: string }
        eraId: { type: string, description: "'' before launch (first era applies)" }
        owned: { type: array, items: { type: string } }
        available: { type: array, items: { type: string }, description: shop cosmetics inside their window now }
        equipped: { $ref: "#/components/schemas/Appearance" }
        bodyRetryAt:
          type: [string, "null"]
          format: date-time
          description: when the next body change is allowed (null = now; 24 h cooldown, free re-pick after a path change)
    FactionWorksView:
      type: object
      required: [settings, works, factions, balance, todayDonated, gameDay, resetsAt, mine]
      properties:
        settings:
          type: object
          properties:
            currency: { type: string }
            dailyCapPerCharacter: { type: integer, format: int64 }
            minAmount: { type: integer, format: int64 }
            donorBoardSize: { type: integer }
        works:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              goal: { type: integer, format: int64 }
              start: { type: integer, format: int64 }
              stages:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: integer, format: int64 }
                    decoration: { type: object, properties: { slug: { type: string }, name: { type: string } } }
        factions:
          type: array
          items: { type: object, properties: { factionId: { type: string }, donatedTotal: { type: integer, format: int64 } } }
        balance: { type: integer, format: int64 }
        todayDonated: { type: integer, format: int64 }
        gameDay: { type: string, format: date }
        resetsAt: { type: string, format: date-time }
        mine:
          type: [object, "null"]
          properties:
            factionId: { type: string }
            myTotal: { type: integer, format: int64 }
            progress:
              type: object
              properties:
                total: { type: integer, format: int64 }
                workIndex: { type: integer }
                workDonated: { type: integer, format: int64 }
                unlocked: { type: array, items: { type: string } }
            donors:
              type: array
              description: Công đức bảng — display only, never an input of merit, ranking or điểm duyên
              items:
                type: object
                properties: { characterId: { type: string, format: uuid }, name: { type: string }, total: { type: integer, format: int64 } }
    PaymentStatus:
      type: string
