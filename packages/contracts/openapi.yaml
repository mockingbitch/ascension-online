openapi: 3.1.0
info:
  title: Tiên Đạo Online API
  version: 0.3.0
  description: |
    REST/JSON API (GDD §17). Server is authoritative: every mutation returns the new
    authoritative state. Mutations require an `Idempotency-Key` header.
servers:
  - url: /api/v1
paths:
  /realms:
    get:
      summary: Realm catalogue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RealmCatalogue" }
  /vip/tiers:
    get:
      summary: Tiên Duyên (VIP) ladder, earning activities and top-up rate (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VipTiersResponse" }
  /items:
    get:
      summary: Item definitions
      responses: { "200": { description: OK } }
  /auth/google/start:
    get:
      summary: Start Google sign-in (302 to Google). Sets a short-lived signed flow cookie.
      parameters:
        - { name: return, in: query, schema: { type: string, example: /cultivate }, description: same-origin path to return to }
      responses: { "302": { description: Redirect to Google }, "503": { $ref: "#/components/responses/Error" } }
  /auth/google/callback:
    get:
      summary: Google redirect target. Sets the refresh cookie and 302s to PUBLIC_BASE_URL + return path (or /login?error=...).
      responses: { "302": { description: Redirect to the web app } }
  /auth/refresh:
    post:
      summary: Rotate the refresh cookie and return a new in-memory access token
      parameters:
        - { name: X-Requested-With, in: header, required: true, schema: { type: string, enum: [tiendao] } }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke the session family and clear the cookie
      responses: { "204": { description: Signed out } }
  /me:
    get:
      summary: Current account
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
  /character:
    get:
      summary: Character view (cultivation projected to now, read-only)
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CharacterView" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: >-
        Create the account's single character. 400 `invalid_name` (format) or `name_not_allowed` (moderation filter,
        content/catalog/moderation.yaml — message says the category, never the matched term).
        **Onboarding intent** (data-model §9.6): with `factionId` (Idempotency-Key required) one transaction creates
        the character at the first stage of the faction's path (`path` if the faction allows it, else its first
        path) and joins the faction (first join starts the switch cooldown). Faction errors as in /factions/join
        (`unknown_faction` 404, `faction_closed` 409, `path_not_allowed` 400, `idempotency_key_reused` 409); on any
        error nothing is created. A retry with the same key, name and faction returns 200 with `replayed: true`.
        `path` without `factionId` → 400. Optional `appearance` (Look, needs `factionId`): `unknown_look` 400,
        `wrong_path` 422 (body/option not of the faction's path), `not_owned` 409; written in the same transaction.
      security: [{ bearer: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: required when factionId is set
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 24 }
                factionId: { type: string, description: onboarding — faction to join in the same transaction }
                path: { type: string, enum: [tien, vu], description: requested path (must be allowed by the faction) }
                appearance:
                  $ref: "#/components/schemas/Look"
                  description: >-
                    onboarding look (appearances.yaml, display only; needs factionId). Validated for the faction's path;
                    does not start the 24 h body cooldown. Absent = the path default.
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CharacterView" } } } }
        "200": { description: Onboarding replay (same Idempotency-Key), content: { application/json: { schema: { $ref: "#/components/schemas/CharacterView" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /breakthrough/preview:
    get:
      summary: >-
        Realm (major) breakthrough quote: readiness, missing requirements, disclosed odds breakdown and — for
        tribulations — the cultivation that a failure would lose. Includes the pending idle settlement, so the shown
        loss equals the loss the attempt would apply now.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BreakthroughPreview" } } } }
  /breakthrough/attempt:
    post:
      summary: >-
        Attempt the realm breakthrough (items consumed on success and failure). Pre-tribulation failure keeps
        cultivation (+pity, cooldown); a failed tribulation loses lossBp of the current stage's stored cultivation
        (never a stage), +1 streak, 24h cooldown; guaranteed after guaranteeAfter consecutive fails.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                acceptLossMilli:
                  type: integer
                  format: int64
                  minimum: 0
                  description: >-
                    Guard only (never used as a value): send the preview's tribulation.maxLossMilli. If the loss the
                    server would apply exceeds it, nothing is written and the response is 409 quote_changed with a
                    fresh preview. Required for a non-guaranteed tribulation (400 quote_required otherwise).
                acceptSuccessBp:
                  type: integer
                  description: >-
                    Guard only: send the preview's successBp. If the server's success chance at the attempt is LOWER
                    (a hộ pháp went offline, the pháp bảo was unequipped…), nothing is written and the response is 409
                    quote_changed with a fresh preview. Optional (omitted = no odds guard).
      responses:
        "200": { description: Result, content: { application/json: { schema: { $ref: "#/components/schemas/BreakthroughResult" } } } }
        "400": { description: "invalid_body | quote_required — for quote_required error.details is a BreakthroughPreview" }
        "409": { description: "not_ready | quote_changed — error.details is a BreakthroughPreview" }
  /leaderboards/global:
    get:
      summary: Thiên Bảng page
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: >-
            `{ entries, total, offset }`; each entry `{ rank, characterId, name, stageId, score, stageReachedAt,
            avatarFrameId?, titleId?, look? }` — `look` (Look) is the chosen look resolved for the row's path (display only).
        "503": { $ref: "#/components/responses/Error" }
  /leaderboards/global/me:
    get:
      summary: Caller's rank
      security: [{ bearer: [] }]
      responses: { "200": { description: "{ rank, score, characterId } — rank 0 = unranked" } }
  /vip/status:
    get:
      summary: Caller's điểm duyên, Tiên Duyên level benefits, distance to next level and today's earning progress
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VipStatus" }
  /admin/vip/refund:
    post:
      summary: >-
        Admin: refund one top-up purchase ledger row — removes exactly its điểm duyên (the level may drop). At most once
        per purchase; idempotent per Idempotency-Key; audited (admin_audit_logs vip.refund).
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ledgerId, reason]
              properties: { ledgerId: { type: integer, format: int64 }, reason: { type: string, maxLength: 500 } }
      responses:
        "200":
          description: Refund + the user's new status
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund:
                    type: object
                    properties:
                      userId: { type: string, format: uuid }
                      ledgerId: { type: integer, format: int64, description: The purchase that was refunded }
                      refundLedgerId: { type: integer, format: int64, description: The refund row written (the audit row stores it too) }
                      pointsRemoved: { type: integer, format: int64 }
                      pointsBefore: { type: integer, format: int64 }
                      pointsAfter: { type: integer, format: int64 }
                      replayed: { type: boolean }
                  status: { $ref: "#/components/schemas/VipStatus" }
        "400": { description: invalid_refund }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: ledger_not_found }
        "409": { description: "not_refundable | already_refunded | idempotency_key_reused | insufficient_points" }
  /admin/vip/grant:
    post:
      summary: "Admin: add/remove điểm duyên (audited, idempotent)"
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { userId: { type: string, format: uuid }, delta: { type: integer }, note: { type: string } } }
      responses: { "200": { description: VIP status }, "403": { $ref: "#/components/responses/Error" } }
  /admin/world/start:
    post:
      summary: Start the world clock (server day 0). Idempotent; audited.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: World state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldState" }
        "403": { $ref: "#/components/responses/Error" }
  /world:
    get:
      summary: >-
        Public story clock (data-model §11): era, progress per active player toward the next milestone with its
        70%–150% window and estimate, active ranged events, pending faction effects, full timeline. Cached 15 s.
      responses:
        "200":
          description: World view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldView" }
        "429": { $ref: "#/components/responses/Error" }
  /factions:
    get:
      summary: >-
        Faction catalogue (factions.yaml) with open flags for the current era, member counts and the era's merit ranking
        (Σ credited points of the faction's members since the era started, decision H). Public, cached 15 s. Counts and
        merit come from the rebuildable Redis cache; when it is down, counts come from Postgres and rankingAvailable=false.
      responses:
        "200":
          description: Faction list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionList" }
        "429": { $ref: "#/components/responses/Error" }
  /factions/me:
    get:
      summary: Caller's membership (factionId null = none), cooldown, lock, pending split choice, upcoming effect, last 10 changes
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionMembership" }
        "404": { description: "character_not_found" }
  /factions/join:
    post:
      summary: >-
        Join a faction for the first time. The faction must be open in the current era; when the character's path is
        not allowed it is converted to the requested `path` (or the faction's first path) at the same tier/stage —
        cultivation is kept. Idle cultivation is settled first (credited to the previous faction). The first join starts
        the switch cooldown too. An Idempotency-Key is bound to its operation and target.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactionChangeRequest" }
      responses:
        "200":
          description: New membership (replayed=true when the Idempotency-Key was already used)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionChangeResult" }
        "400": { description: "path_not_allowed" }
        "404": { description: "character_not_found | unknown_faction" }
        "409": { description: "already_member | faction_closed | idempotency_key_reused" }
  /factions/switch:
    post:
      summary: >-
        Switch to another open faction. Needs switchCooldownSeconds since the last player switch (world moves never touch
        it) and no active lock. Same path rules as join.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactionChangeRequest" }
      responses:
        "200":
          description: New membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionChangeResult" }
        "400": { description: "path_not_allowed" }
        "404": { description: "character_not_found | unknown_faction" }
        "409": { description: "not_member | same_faction | switch_cooldown | faction_locked | faction_closed | idempotency_key_reused" }
  /factions/split-choice:
    post:
      summary: >-
        Choose a branch while a split of the caller's faction is pending (membership.mustChoose, before chooseDeadline).
        Ignores and does not start the switch cooldown; refused while locked (faction_locked). After the deadline the
        worker places everyone still pending one by one (character id order) into the branch with the fewest members
        placed by this split so far (choices + defaults; ties → catalogue order).
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factionId]
              additionalProperties: false
              properties: { factionId: { type: string } }
      responses:
        "200":
          description: New membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionChangeResult" }
        "400": { description: "not_a_branch" }
        "409": { description: "not_member | no_pending_split | choice_closed | faction_locked | idempotency_key_reused" }
  /factions/{factionId}/members:
    get:
      summary: Members of a faction ranked by realm score (same score and tie-break as the global leaderboard), 50 per page
      security: [{ bearer: [] }]
      parameters:
        - { name: factionId, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "nextCursor of the previous page" }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionMembersPage" }
        "400": { description: "invalid_cursor" }
        "404": { description: "unknown_faction" }
        "503": { description: "ranking_unavailable (Redis down; rebuilt from Postgres by the worker)" }
  /admin/factions/lock:
    post:
      summary: >-
        Lock a member's faction switches (reason fengshen | admin | event; hours 0 = permanent). Split choices are
        blocked too (the deadline default places the member). Audited (admin_audit_logs faction.lock).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [characterId, reason, note]
              additionalProperties: false
              properties:
                characterId: { type: string, format: uuid }
                reason: { type: string, enum: [fengshen, admin, event] }
                hours: { type: integer, minimum: 0, maximum: 8760 }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Lock state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionLock" }
        "400": { description: "invalid_lock" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "not_member" }
  /admin/factions/unlock:
    post:
      summary: Remove a member's faction lock. Audited (faction.unlock).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [characterId, note]
              additionalProperties: false
              properties:
                characterId: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Lock state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionLock" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "not_member" }
  /admin/world:
    get:
      summary: "Admin: world view + raw state, last 14 world_daily_totals, overrides, reached milestones"
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Admin world view
          content:
            application/json:
              schema:
                type: object
                required: [world, state, totals, overrides, reached]
                properties:
                  world: { $ref: "#/components/schemas/WorldView" }
                  state: { $ref: "#/components/schemas/WorldState" }
                  totals:
                    type: array
                    items:
                      type: object
                      properties:
                        gameDay: { type: string, format: date }
                        creditedMilli: { type: integer, format: int64 }
                        catchUpBonusMilli: { type: integer, format: int64 }
                        countableMilli: { type: integer, format: int64 }
                        dau: { type: integer }
                        perCapitaMilli: { type: integer, format: int64 }
                        medianPositionMilli: { type: [integer, "null"], format: int64 }
                        closedAt: { type: [string, "null"], format: date-time }
                  overrides: { type: array, items: { $ref: "#/components/schemas/MilestoneOverride" } }
                  reached: { type: array, items: { $ref: "#/components/schemas/WorldReached" } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/world/milestones/{milestoneId}:
    put:
      summary: >-
        Admin: replace the override of an UNREACHED milestone — shift (threshold / target day), force, or hold
        (paused). null fields fall back to the catalogue. Applied by the next worker tick (milestones still fire in
        order). Audited (admin_audit_logs world.milestone_override).
      security: [{ bearer: [] }]
      parameters:
        - { name: milestoneId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                thresholdPointsPerActive: { type: [integer, "null"], minimum: 0 }
                targetDay: { type: [integer, "null"], minimum: 0 }
                forceReach: { type: boolean }
                paused: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Override now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilestoneOverride" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/world/pause:
    post:
      summary: "Admin: hold milestone reaching (days still close and fold). Audited; repeat = no-op."
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: World state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldState" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/world/resume:
    post:
      summary: "Admin: release a pause. Audited; repeat = no-op."
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: World state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldState" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/inventory/grant:
    post:
      summary: "Admin: grant items to a character (audited, idempotent)"
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { characterId: { type: string, format: uuid }, itemId: { type: string }, quantity: { type: integer, minimum: 1 }, note: { type: string } }
      responses: { "200": { description: "{ itemId, quantity }" }, "403": { $ref: "#/components/responses/Error" } }
  /inventory:
    get:
      summary: Caller's wallet and items
      security: [{ bearer: [] }]
      responses: { "200": { description: "{ currencies: {spirit_stone, premium}, items: [{itemId, quantity}] }" } }
  /items/{itemId}/use:
    post:
      summary: >-
        Use an item. Offline-bonus items (tu_linh_phu: 1/game day, no stacking) answer `{ itemId, remaining,
        offlineBonusSeconds, replayed }`. Speed items (instantPointsMilli, e.g. tu_linh_dan) credit points through the
        single credit path (source item; speed-item cap 10/day, activity bucket, 150/day ceiling), max_use_per_game_day
        per character, and answer SpeedItemResult. All or nothing: unless the pill's FULL value fits (speed cap, activity
        bucket, 150 ceiling, bình cảnh room) it is NOT consumed (409 no_room / bottleneck_full).
      security: [{ bearer: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: BonusStatus (offline bonus) or SpeedItemResult (speed item)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeedItemResult" }
        "400": { description: "not_usable" }
        "409": { description: "no_item | bonus_active | used_today | daily_limit | no_room | bottleneck_full" }
  /vip/daily-gift:
    post:
      summary: Claim today's Tiên Duyên spirit-stone gift (once per game day, UTC+7)
      security: [{ bearer: [] }]
      responses:
        "200": { description: "{ tier, amount, currency, balance, nextResetAt }" }
        "409": { description: "no_gift | already_claimed" }
  /tasks/daily:
    get:
      summary: Today's daily tasks with progress
      security: [{ bearer: [] }]
      responses:
        "200":
          description: >-
            { gameDay, resetsAt, tasks: [{ id, name, description, kind (checkin | settle | breakthrough_attempt |
            lecture_attend | incense), target, rewards, streakRewards?, streak? (StreakView, incense only), progress,
            complete, claimed }] }
  /tasks/daily/{taskId}/claim:
    post:
      summary: Claim a completed daily task (once per game day)
      security: [{ bearer: [] }]
      parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Task view; vipPoints = điểm duyên paid by this claim (vip.yaml daily_task_claim, omitted when capped)" }
        "409": { description: "not_complete | already_claimed | use_incense (incense is offered via /tasks/daily/incense)" }
  /tasks/daily/incense:
    post:
      summary: >-
        Morning incense ("Dâng hương tĩnh tâm"), once per game day. Builds the streak, pays streak_rewards points
        (source ritual, activity bucket) and completes + claims the incense task in one transaction. Natural per-day key:
        idempotency is (character, game day) under the progression lock, so NO Idempotency-Key header is used; a repeat
        the same day answers the same result with replayed=true.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncenseResult" }
        "404": { $ref: "#/components/responses/Error" }
  /shop:
    get:
      summary: Spirit-stone shop with the caller's balance and today's remaining limits (shop.yaml)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopView" }
        "404": { $ref: "#/components/responses/Error" }
  /shop/buy:
    post:
      summary: >-
        Buy `lots` of a listing. One transaction: currency debit (ledger) + item grant (ledger) + purchase row; price and
        item come from shop.yaml only; daily_limit_lots enforced under the currency-account lock. Same key → replay.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, lots]
              properties: { listingId: { type: string }, lots: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyResult" }
        "400": { description: "invalid_lots | invalid_body | invalid_idempotency_key" }
        "404": { description: "unknown_listing | character_not_found" }
        "409": { description: "daily_limit | tier_locked | already_owned | insufficient_stones | idempotency_key_reused (same key, different listing or lots)" }
  /cosmetics/catalog:
    get:
      summary: >-
        Public cosmetics catalogue (decisions 2026-11-07 "Linh thạch sinks"): titles, portrait frames, chat name effects,
        cave decorations — ids "<kind>:<slug>" shared with vip.yaml perks. NO gameplay effect. Cached 5 min; rate-limited per IP.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CosmeticCatalog" }
        "429": { description: rate_limited }
  /cosmetics:
    get:
      summary: Owned (purchases + Tiên Duyên perks reached), on sale now (season/era window) and the equipped look.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CosmeticsView" }
        "404": { description: character_not_found }
  /cosmetics/buy:
    post:
      summary: >-
        Buy one shop cosmetic. One transaction: lock currency account → idempotency → catalogue price, window, Tiên
        Duyên gate (cosmetics only), owned at most once → debit (currency_ledger cosmetic_purchase) → ownership row.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cosmeticId]
              properties: { cosmeticId: { type: string, example: "avatar_frame:ngoc_bich" } }
      responses:
        "200":
          description: OK (replayed = true for the same key)
          content:
            application/json:
              schema:
                type: object
                required: [cosmeticId, price, replayed, state]
                properties:
                  cosmeticId: { type: string }
                  price: { type: integer, format: int64 }
                  replayed: { type: boolean }
                  state: { $ref: "#/components/schemas/CosmeticsView" }
        "400": { description: "invalid_body | invalid_idempotency_key" }
        "404": { description: "unknown_cosmetic | character_not_found" }
        "409": { description: "not_for_sale | unavailable | tier_locked | already_owned | insufficient_stones | idempotency_key_reused" }
  /cosmetics/equip:
    post:
      summary: >-
        Set the WHOLE loadout ("" / [] = unequip). Locks the appearance row; every id must be owned and of the slot's
        kind; ≤ settings.caveSlots decorations, no duplicates. Optional `look` (body / accessory / robe / pose): valid for
        the character's path, owned, and a body change at most once per 24 h (a path change grants one free re-pick);
        absent = keep. Same key + same loadout = replay; other loadout = 409.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Appearance" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [replayed, state]
                properties:
                  replayed: { type: boolean }
                  state: { $ref: "#/components/schemas/CosmeticsView" }
        "400": { description: "invalid_loadout | unknown_look | invalid_body | invalid_idempotency_key" }
        "404": { description: character_not_found }
        "409": { description: "not_owned | idempotency_key_reused | body_cooldown (details.retryAt)" }
        "422": { description: wrong_path }
  /factions/works:
    get:
      summary: >-
        Faction works (faction_works.yaml): definitions, every faction's donated pool, and the caller's faction detail
        (progress, unlocked decorations, công đức bảng). mine = null when not in a faction.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionWorksView" }
        "404": { description: character_not_found }
  /factions/donate:
    post:
      summary: >-
        Donate spirit stones to the caller's current faction works. One transaction, lock order character_faction →
        currency_accounts → faction_donation_days (per-character daily cap, across factions) → faction_treasuries.
        PURELY VISUAL: adds no faction merit, ranking points, điểm duyên or tu vi.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties: { amount: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: OK (replayed = true for the same key)
          content:
            application/json:
              schema:
                type: object
                required: [donationId, amount, replayed, state]
                properties:
                  donationId: { type: integer, format: int64 }
                  amount: { type: integer, format: int64 }
                  replayed: { type: boolean }
                  state: { $ref: "#/components/schemas/FactionWorksView" }
        "400": { description: "invalid_amount | invalid_body | invalid_idempotency_key" }
        "404": { description: character_not_found }
        "409": { description: "no_faction | daily_cap | insufficient_stones | idempotency_key_reused" }
  /trials:
    get:
      summary: >-
        Mini-game trials (Phase 3) as seen by the character: state (available | in_progress | cooldown | passed |
        locked), lose cooldown, valid pass, open run and the rules snapshot (params) the client simulates.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrialStatus" } } } }
        "404": { description: character_not_found }
  /trials/{kind}/start:
    post:
      summary: >-
        Issue a server-seeded run of a trial kind (trials.yaml), or resume the open one (same seed, game restarts
        from tick 0). Refused while a lose cooldown runs, while a valid pass exists, or when the character is not at
        the gated realm (opens_at). An expired never-submitted run is closed as expired/abandoned with a cooldown.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: kind, in: path, required: true, schema: { type: string, example: tam_ma } }
      responses:
        "201": { description: New run, content: { application/json: { schema: { $ref: "#/components/schemas/TrialRunStart" } } } }
        "200": { description: Resumed (open run or same Idempotency-Key), content: { application/json: { schema: { $ref: "#/components/schemas/TrialRunStart" } } } }
        "400": { description: invalid_idempotency_key }
        "404": { description: "trial_not_found | character_not_found" }
        "409":
          description: >-
            cooldown | pass_active | not_eligible (error.details = TrialKindStatus) | idempotency_key_reused (key
            already used for another kind)
  /trials/{runId}/submit:
    post:
      summary: >-
        Single-use submission. The server replays the input log from the run's seed and rules snapshot and decides:
        expired (after expiresAt) → rejected (invalid_log | implausible_score | implausible_input: tâm ma more than
        maxInputsPerWindow inputs in a window, hóa phàm a step > maxStep, too much travel / too many strokes in a
        window or a re-press faster than minLiftTicks | too_fast: less server time than
        endTick × tickMs × min_elapsed_bp | mismatch: replay ≠ claimed endTick/lines/score/stateHash) → the game's
        own outcome (pass: cleared; fail: topped_out | lanterns_out | time_up | gave_up). Any non-pass verdict starts the lose
        cooldown. Pass: valid pass_valid_seconds, kept through failed breakthroughs, consumed by the successful one;
        +điểm duyên trial_pass (vip.yaml, capped). Same Idempotency-Key again → the stored verdict (replayed).
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrialClaim" }
      responses:
        "200": { description: Verdict, content: { application/json: { schema: { $ref: "#/components/schemas/TrialSubmitResult" } } } }
        "400": { description: "invalid_body (incl. over the 96 KiB claim limit) | invalid_idempotency_key" }
        "404": { description: "run_not_found (unknown, or another character's run) | character_not_found" }
        "409": { description: already_submitted (judged before with another Idempotency-Key) }
  /secret-realms:
    get:
      summary: >-
        Bí cảnh (Phase 3.4): every realm with today's runs left, the public loot tables (bands by replayed score,
        survived bonus, pháp bảo table with weights), daily caps, today's totals, the open run and the rules snapshot;
        plus the last judged runs. Nothing depends on Tiên Duyên.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SecretRealmView" } } } }
  /secret-realms/{realmId}/start:
    post:
      summary: >-
        Issue a seeded run (201) — counts toward runs_per_day at START (abandoned runs count) — or resume the open,
        unexpired run with the same seed (200). Same Idempotency-Key → the same run.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: realmId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Resumed, content: { application/json: { schema: { $ref: "#/components/schemas/SecretRealmStart" } } } }
        "201": { description: Issued, content: { application/json: { schema: { $ref: "#/components/schemas/SecretRealmStart" } } } }
        "404": { description: realm_not_found | character_not_found }
        "409": { description: "daily_limit | locked (below min_tier); details = SecretRealmStatus" }
  /secret-realms/runs/{runId}/submit:
    post:
      summary: >-
        Single-use submission of the RLE movement log. The server replays it: expired (late) → rejected (invalid_log |
        implausible_score | too_fast | implausible_input: more than maxChangesPerWindow direction changes in a window |
        mismatch) → pass (survived) / fail (fallen | gave_up). pass/fail with endTick ≥ minRewardTicks earn the band of
        the replayed score: loot rolled server-side, clipped by the daily caps (disclosed), granted through
        currency_ledger / inventory_transactions in the same transaction (key sr:<runId>). A pháp bảo already owned
        becomes duplicate stones. Survived: +điểm duyên trial_pass (capped). Same key → the stored verdict and loot.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SecretRealmClaim" } } }
      responses:
        "200": { description: Verdict + loot, content: { application/json: { schema: { $ref: "#/components/schemas/SecretRealmSubmit" } } } }
        "400": { description: "invalid_body (incl. over the 32 KiB claim limit) | invalid_idempotency_key" }
        "404": { description: run_not_found | character_not_found }
        "409": { description: already_submitted }
  /artifacts:
    get:
      summary: The equipped pháp bảo (one slot) and its tribulation bonus (0 if no longer owned)
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EquippedArtifact" } } } }
  /artifacts/equip:
    post:
      summary: Set the pháp bảo slot (itemId "" = unequip). Must be an owned artifact. Naturally idempotent.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [itemId], properties: { itemId: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EquippedArtifact" } } } }
        "400": { description: not_artifact }
        "409": { description: not_owned }
  /protector:
    get:
      summary: >-
        Hộ pháp state: my open invite with its protectors (online / same faction / counts now), online fellow members,
        fellow members' open invites I may accept, my assists left today.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProtectorView" } } } }
  /protector/invite:
    post:
      summary: >-
        Open (or return) my invite — needs a faction and the last stage of a tribulation realm. Valid
        invite_window_seconds; used by the next tribulation attempt, which counts accepted protectors still online and
        in the faction (≤ protector_bonus_max / per_member) and snapshots them in breakthrough_attempts.odds.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProtectorView" } } } }
        "409": { description: "no_faction | not_eligible | not_ready (the tribulation could not be attempted now)" }
  /protector/invites/{inviteId}/accept:
    post:
      summary: >-
        Guard a fellow member's invite (same faction, not my own, not expired/used). Spends one of daily_assists; the
        same invite twice spends one. Counted protectors earn protector_assist điểm duyên after the attempt (worker).
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProtectorView" } } } }
        "403": { description: "other_faction | realm_too_low (protector.yaml min_tier) | character_too_new (min_character_age_days)" }
        "409": { description: invite_gone | self | daily_limit | idempotency_key_reused }
  /presence/ping:
    post:
      summary: >-
        "I am online" for hộ pháp: Redis key with a TTL (presence_ttl_seconds), no DB write. Counts only when the same
        user made a successful authenticated game mutation within activity_window_seconds (online = false otherwise).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { online: { type: boolean }, pingEverySeconds: { type: integer } } }
        "503": { description: presence not configured (no Redis) }
  /admin/protector/pairs:
    get:
      summary: Admin review of hộ pháp pairs (inviter → protector) over the last `days` game days with ≥ `min` assists (≤ 200)
      security: [{ bearer: [] }]
      parameters:
        - { name: min, in: query, schema: { type: integer, minimum: 1, default: 3 } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 14 } }
      responses:
        "200": { description: "{ min, days, pairs: [{ inviterId, inviterName, protectorId, protectorName, assists, counted, firstDay, lastDay }] }" }
        "403": { description: forbidden }
  /fortune:
    get:
      summary: Gieo quẻ — disclosed odds, today's draw (null if not drawn) and the active rate buff
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FortuneView" }
  /fortune/draw:
    post:
      summary: >-
        Draw today's gieo quẻ (server RNG, once per game day). Settles idle time first, then sets an idle-rate buff
        (rateBonusBp ≤ contribution idle.max_buff_bonus_bp) until the next reset; the idle bucket cap and 150/day ceiling
        still apply. Natural per-day key: idempotency is the daily_fortunes primary key (character, game day), so NO
        Idempotency-Key header is used; a repeat the same day answers today's draw with replayed=true.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK (includes `cultivation` snapshot)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FortuneView" }
  /cultivation/settle:
    post:
      summary: >-
        Settle accumulated idle cultivation through the single credit path (catch-up ×2, bucket caps, 150/day
        ceiling, bình cảnh, automatic minor stages, late-join reserve release)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Authoritative cultivation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CultivationStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /reports:
    post:
      summary: >-
        Report a character (offensive name or harassment), or a trade (reason trade_abuse + tradeOfferId: the reporter must
        be a party; the target is the other party). Idempotent; one open report per target+reason.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                targetCharacterId: { type: string, format: uuid, description: required unless tradeOfferId }
                reason: { type: string, enum: [offensive_name, harassment, trade_abuse] }
                tradeOfferId: { type: string, format: uuid, description: "trade_abuse only: the offer reported" }
                note: { type: string, maxLength: 500 }
                chatMessageId: { type: integer, format: int64, description: "Optional: a message sent by the target (its text is kept as evidence)" }
      responses:
        "200": { description: The report (existing one on replay/duplicate), content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/reports:
    get:
      summary: "Admin: report queue, oldest first"
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, dismissed, actioned], default: open } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports: { type: array, items: { $ref: "#/components/schemas/AdminReport" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
  /admin/reports/{reportId}/resolve:
    post:
      summary: >-
        Admin: resolve a report (audited). `renameTo` (actioned only) renames the character through the same name
        filter and closes every other open offensive_name report against it.
      security: [{ bearer: [] }]
      parameters: [{ name: reportId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [dismissed, actioned] }
                note: { type: string, maxLength: 1000 }
                renameTo: { type: string }
      responses:
        "200":
          description: Resolution
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { $ref: "#/components/schemas/Report" }
                  resolutionNote: { type: string }
                  renamedFrom: { type: string }
                  renamedTo: { type: string }
                  alsoResolved: { type: array, items: { type: string, format: uuid } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /chat/{channel}/messages:
    parameters: [{ name: channel, in: path, required: true, schema: { type: string, example: world } }]
    get:
      summary: Chat history (visible messages, oldest first). Live updates arrive over /ws (chat.message, chat.hidden).
      security: [{ bearer: [] }]
      parameters: [{ name: before, in: query, schema: { type: integer, format: int64 }, description: "Message id; omit for newest" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel: { $ref: "#/components/schemas/ChatChannel" }
                  messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
                  maxChars: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: >-
        Post a message. Idempotent per Idempotency-Key. Profanity is masked with *** (moderation.yaml).
        403 stage_too_low (details.minStage) | muted (details.mutedUntil) | no_character; 429 rate_limited | duplicate_message.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 200 } } }
      responses:
        "200": { description: The stored message, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/chat/messages/{messageId}/hide:
    post:
      summary: "Admin: hide a chat message for everyone (audited, idempotent; broadcasts chat.hidden)"
      security: [{ bearer: [] }]
      parameters: [{ name: messageId, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses: { "200": { description: "{ id, hidden }" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /admin/chat/mutes:
    post:
      summary: "Admin: mute an account in chat for N hours (0 lifts; max chat.yaml mute.max_hours). Audited."
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [userId, hours], properties: { userId: { type: string, format: uuid }, hours: { type: integer, minimum: 0 }, reason: { type: string } } }
      responses:
        "200": { description: "{ userId, mutedUntil }" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /announcements/recent:
    get:
      summary: >-
        The world's recent news (public; short history kept by the worker, world_announcements). Newest first, ≤
        recent_limit (announcements.yaml). Clients merge it with the live WebSocket feed by id. Only đạo hiệu + realm/rank.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: "#/components/schemas/WorldAnnouncement" } } }
        "503": { $ref: "#/components/responses/Error" }
  /tutorial/script:
    get:
      summary: >-
        Vân Khê's tutorial lines (content/story/tutorial/*.yaml; decisions 2026-11-09 #1). Public and immutable —
        onboarding steps run in /create before a character exists. Numbers in the lines come from realms.yaml.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TutorialScript" } } } }
        "503": { $ref: "#/components/responses/Error" }
  /tutorial:
    get:
      summary: The caller's tutorial progress (display only; never grants anything)
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TutorialState" } } } }
        "404": { description: character_not_found }
  /tutorial/steps/{stepId}/done:
    post:
      summary: >-
        Mark a stored ("play") step as seen. First mark of a step wins (another device's later mark is a no-op);
        same key = replay; a key used for another step = 409. Onboarding/unknown steps → 404 unknown_step.
      security: [{ bearer: [] }]
      parameters:
        - { name: stepId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TutorialMarkResult" } } } }
        "404": { description: "unknown_step | character_not_found" }
        "409": { description: idempotency_key_reused }
  /tutorial/steps/{stepId}/skip:
    post:
      summary: Same as /done with status skipped (the player dismissed the step).
      security: [{ bearer: [] }]
      parameters:
        - { name: stepId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TutorialMarkResult" } } } }
        "404": { description: "unknown_step | character_not_found" }
        "409": { description: idempotency_key_reused }
  /tutorial/skip-all:
    post:
      summary: '"Không nhắc lại": the guide offers no step on her own (the "?" button still summons her). Same key as the last settings action (skip-all/reset) = replay.'
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TutorialState" } } } }
        "404": { description: character_not_found }
  /tutorial/reset:
    post:
      summary: >-
        Forget every seen step and un-mute the guide (Cài đặt › Xem lại hướng dẫn). Same key as the last settings action
        = replay (a lost answer never wipes steps marked since on another device).
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TutorialState" } } } }
        "404": { description: character_not_found }
  /lecture/scripts:
    get:
      summary: Tử Tiêu Cung lecture loop (public content). Clients play lines on the server clock — (now − cycleEpoch) mod cycleSeconds.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lectures: { type: array, items: { $ref: "#/components/schemas/LectureScript" } }
                  cycleSeconds: { type: integer }
                  cycleEpoch: { type: string, format: date-time }
        "503": { $ref: "#/components/responses/Error" }
  /lecture/state:
    get:
      summary: Hall state, ngộ đạo timing and the viewer's own unpaid listening. Live seat changes arrive over /ws (lecture.enter, lecture.leave).
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LectureState" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /lecture/enter:
    post:
      summary: Take (or keep) a seat in the hall. No amounts; repeating it is harmless. Listening is measured from heartbeats on the server clock.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LectureState" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /lecture/leave:
    post:
      summary: Leave the hall. Unpaid listening is kept until it expires (1 h) or is paid on return.
      security: [{ bearer: [] }]
      responses: { "200": { description: "{ inHall: false }" } }
  /lecture/heartbeat:
    post:
      summary: Presence ping every heartbeatSeconds. 409 not_in_hall → call /lecture/enter again.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LectureMe" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /lecture/insight:
    post:
      summary: >-
        Ngộ đạo: pays the listening the server measured since the last ngộ đạo (capped per insight and per game day;
        source lecture, activity bucket) and điểm duyên at lectures.yaml milestones. Once per slot — a repeat returns
        the stored result with replayed=true. 409 insight_closed | nothing_to_pay | not_in_hall.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InsightResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /lecture/notebook:
    get:
      summary: The Đạo ngộ notebook — lectures the player has had a paid ngộ đạo in.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { entries: { type: array, items: { $ref: "#/components/schemas/NoteEntry" } } } }
  # ───── nạp Tiên Duyên (Phase 4; decisions 2026-11-07 "Khung nạp Tiên Duyên") ─────
  /payments/packages:
    get:
      summary: >-
        Public top-up catalogue (payments.yaml). Points per package = vip.yaml rate (1.000đ = pointsPer1000Vnd), no bonus.
        providers lists the gateways enabled on this server; empty = top-up closed.
      responses:
        "200": { description: Packages, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentPackagesView" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /payments/orders:
    get:
      summary: Own top-up history, newest first (≤ 50).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { type: object, properties: { orders: { type: array, items: { $ref: "#/components/schemas/PaymentOrder" } } } }
    post:
      summary: >-
        Open an order for a package (intent only — amount and points come from the catalogue). Same Idempotency-Key →
        same order (replayed: true); another package under that key → 409. At most max_open_orders_per_user open orders.
        The response carries the provider checkout URL. Nothing is credited until a signature-verified provider
        webhook (or reconciliation) confirms the payment; the browser return URL never credits.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [packageId]
              properties:
                packageId: { type: string }
                provider: { type: string, description: Optional; default = first enabled provider }
      responses:
        "201": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentOrderResult" } } } }
        "400": { $ref: "#/components/responses/Error", description: "unknown_package | invalid_amount | invalid_idempotency_key" }
        "409": { $ref: "#/components/responses/Error", description: "too_many_open_orders | topup_closed | idempotency_key_reused" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error", description: provider_unavailable }
  /payments/orders/{orderId}:
    get:
      summary: One OWN order (another user's id → 404) plus the current Tiên Duyên status — poll this after checkout.
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentOrderResult" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /payments/webhook/{provider}:
    post:
      summary: >-
        PUBLIC provider webhook. The provider signature is verified over the raw body BEFORE anything else (bad /
        missing / stale → 401, nothing written). Then the normalized event is deduped by provider event id (replay →
        200 outcome replayed) and applied in one transaction: paid → vip.TopupLocked anchored on the order (exactly
        once) + order paid; amount/points mismatch → rejected and alerted; failed/expired after paid → ignored.
        Sandbox signature header: X-Sandbox-Signature "t=<unix>,v1=<hex HMAC-SHA256(secret, t + '.' + body)>", ±5 min.
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, description: Provider-specific payload (≤ 16 KiB) } } } }
      responses:
        "200": { description: Applied / replayed / ignored / rejected, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentWebhookResult" } } } }
        "400": { $ref: "#/components/responses/Error", description: invalid_payload }
        "401": { $ref: "#/components/responses/Error", description: invalid_signature }
        "404": { $ref: "#/components/responses/Error", description: unknown_provider }
        "413": { $ref: "#/components/responses/Error", description: payload_too_large }
  /dev/payments/sandbox/{orderId}:
    post:
      summary: >-
        DEV ONLY (registered only when APP_ENV=dev). The sandbox gateway's "pay now / fail": records the simulated charge
        and, unless deliver=false (lost webhook → reconciliation), sends a correctly signed webhook through the real
        verification path. Order owner (or admin) only.
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [paid, failed] }
                deliver: { type: boolean, default: true }
                amountVnd: { type: integer, format: int64, description: Override the paid amount (mismatch testing) }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  delivered: { type: boolean }
                  webhook: { $ref: "#/components/schemas/PaymentWebhookResult" }
                  order: { $ref: "#/components/schemas/PaymentOrder" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/payments/orders:
    get:
      summary: "Admin: search orders (status, userId, q = order id or provider ref), newest first."
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [created, pending, paid, failed, expired, refunded] } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { type: object, properties: { orders: { type: array, items: { $ref: "#/components/schemas/AdminPaymentOrder" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/payments/orders/{orderId}:
    get:
      summary: "Admin: one order and every provider event recorded for it."
      security: [{ bearer: [] }]
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Order + events
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/AdminPaymentOrder" }
                  events: { type: array, items: { $ref: "#/components/schemas/PaymentEvent" } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/payments/orders/{orderId}/refund:
    post:
      summary: >-
        Admin: mark a PAID order refunded — provider refund first when the adapter supports it, then in one transaction
        vip refund of the purchase row (điểm duyên removed, level may drop, perk cosmetics above the new level
        unequipped), order refunded, audit rows vip.refund + payment.refund. The order is the anchor: retries are one
        refund (replayed: true). Daily gifts already claimed are not clawed back.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/AdminPaymentOrder" }
                  refund: { type: object, description: Same shape as /admin/vip/refund refund }
                  vip: { $ref: "#/components/schemas/VipStatus" }
                  replayed: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "not_refundable | insufficient_points" }
        "502": { $ref: "#/components/responses/Error", description: provider_unavailable }
  /admin/payments/alerts:
    get:
      summary: "Admin: rejected / ignored provider events (amount_mismatch, unknown_order, provider_refund_needs_admin, out-of-order), newest first (≤ 100)."
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/PaymentEvent" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /dao-lu:
    get:
      summary: >-
        Đạo lữ (Phase 5.1): rules (dao_lu.yaml), my gate blockers, cooldown, proposals left today, my bond (partner +
        online), open incoming/outgoing proposals and today's song tu state.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DaoLuView" } } } }
  /dao-lu/proposals:
    post:
      summary: >-
        Cầu thân: propose a permanent bond to a character (from a player card). acknowledgePermanent must be true (the
        proposer's "vĩnh viễn" confirmation). Both accounts ≥ min_account_age_days, both characters ≥ min_tier, neither
        bonded nor in the rebond cooldown; one open outgoing proposal; daily_proposals per game day. Accounts that shared a
        network recently are flagged to admins, never blocked.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetCharacterId, acknowledgePermanent]
              properties:
                targetCharacterId: { type: string, format: uuid }
                acknowledgePermanent: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DaoLuView" } } } }
        "400": { $ref: "#/components/responses/Error", description: permanent_not_acknowledged }
        "404": { $ref: "#/components/responses/Error", description: target_not_found }
        "409": { $ref: "#/components/responses/Error", description: "not_eligible (details.side, details.blockers) | open_proposal | self" }
        "429": { $ref: "#/components/responses/Error", description: daily_limit }
  /dao-lu/proposals/{proposalId}/accept:
    post:
      summary: >-
        Accept an incoming proposal — the target's explicit second "vĩnh viễn" confirmation (acknowledgePermanent: true).
        Gates are re-checked; one active bond per character (a concurrent second bond fails with already_bonded); every
        other pending proposal of both is superseded. Idempotent by key.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [acknowledgePermanent], properties: { acknowledgePermanent: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DaoLuView" } } } }
        "400": { $ref: "#/components/responses/Error", description: permanent_not_acknowledged }
        "409": { $ref: "#/components/responses/Error", description: "proposal_gone | already_bonded | not_eligible" }
  /dao-lu/proposals/{proposalId}/decline:
    post:
      summary: Decline an incoming proposal (target). Idempotent by key.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DaoLuView" } } } }
        "409": { $ref: "#/components/responses/Error", description: proposal_gone }
  /dao-lu/proposals/{proposalId}/cancel:
    post:
      summary: Withdraw my own pending proposal (proposer). Idempotent by key. (There is no way to leave a bond — cot-truyen §5.6.)
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DaoLuView" } } } }
        "409": { $ref: "#/components/responses/Error", description: proposal_gone }
  /dao-lu/song-tu:
    get:
      summary: Today's song tu state (no accrual).
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SongTuView" } } } }
        "404": { $ref: "#/components/responses/Error", description: no_bond }
  /dao-lu/song-tu/start:
    post:
      summary: >-
        Open today's song tu session (either partner; both must be ACTIVE = a successful game mutation within protector.yaml
        activity_window_seconds — a heartbeat or ping is not one). Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SongTuView" } } } }
        "409": { $ref: "#/components/responses/Error", description: "not_active | partner_not_active" }
        "503": { $ref: "#/components/responses/Error", description: song tu needs Redis }
  /dao-lu/song-tu/heartbeat:
    post:
      summary: >-
        Heartbeat every heartbeatSeconds while the song tu panel is open. Overlap accrues on the server clock only while
        both partners are active and both beat within max_gap_seconds, up to windowSeconds per game day. Does NOT refresh
        the activity window.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SongTuView" } } } }
        "409": { $ref: "#/components/responses/Error", description: no_session }
  /dao-lu/song-tu/claim:
    post:
      summary: >-
        Claim my unclaimed overlap: rate_milli_per_hour × seconds credited via the single credit path (source
        dual_cultivation → community bucket, inside the bucket cap and the 150 ceiling); the first claim of the day
        reaching duyen_min_seconds also earns vip.yaml dual_cultivation. Each partner claims separately. Idempotent by key.
        Unclaimed overlap is lost at the game-day reset.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SongTuClaimResult" } } } }
        "409": { $ref: "#/components/responses/Error", description: "nothing_to_claim | day_capped" }
  /admin/dao-lu/bonds/{bondId}/terminate:
    post:
      summary: "Admin: end a bond after a report by or about one of the partners (note required). Audited (admin_audit_logs dao_lu.terminate + dao_lu_events)."
      security: [{ bearer: [] }]
      parameters: [{ name: bondId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportId, note]
              properties: { reportId: { type: string, format: uuid }, note: { type: string, maxLength: 1000 } }
      responses:
        "200": { description: Ended }
        "400": { $ref: "#/components/responses/Error", description: "report_required | report_mismatch | note_required" }
        "409": { $ref: "#/components/responses/Error", description: bond_ended }
  /admin/dao-lu/flags:
    get:
      summary: "Admin: proposals/bonds between accounts that shared a network hash within 30 days (?days=, newest first, ≤ 200)."
      security: [{ bearer: [] }]
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }]
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema: { type: object, properties: { days: { type: integer }, flags: { type: array, items: { $ref: "#/components/schemas/DaoLuFlag" } } } }
  /admin/netsig/clusters:
    get:
      summary: >-
        Admin: account sets seen on the same network (salted IP hash, recorded at Google login and session refresh, kept
        30 days) — largest first. Never returns a hash or an IP.
      security: [{ bearer: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 30 } }
        - { name: min, in: query, schema: { type: integer, minimum: 2, maximum: 50, default: 2 } }
      responses:
        "200":
          description: Clusters
          content:
            application/json:
              schema: { type: object, properties: { clusters: { type: array, items: { $ref: "#/components/schemas/NetCluster" } } } }
  /trades:
    get:
      summary: >-
        Trao đổi (Phase 5.2): rules (trade.yaml — tradable assets + stone-equivalent values, fee, caps, gates), my limits
        today, pending incoming/outgoing offers (what accepting NOW would move and burn).
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradeView" } } } }
    post:
      summary: >-
        Create a gift (take empty) or a swap offer to a character. Lines are intent only (asset id + quantity); only
        trade.yaml assets (linh thạch, plain materials) are accepted — pháp bảo, requirement items, shop items, cosmetics
        and premium are refused. Nothing is escrowed: everything is re-verified and moved at accept. Gates: the giver
        passes rules.send, whoever receives passes rules.receive (both, in a swap). Accounts that shared a network
        recently are flagged to admins, never blocked.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiverCharacterId, give]
              properties:
                receiverCharacterId: { type: string, format: uuid }
                give: { type: array, items: { $ref: "#/components/schemas/TradeLineInput" }, description: sender → receiver }
                take: { type: array, items: { $ref: "#/components/schemas/TradeLineInput" }, description: "receiver → sender (swap); empty = gift" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradeView" } } } }
        "400": { $ref: "#/components/responses/Error", description: "invalid_lines (details.reason: not_tradable | bad_quantity | duplicate_line | same_asset_both_sides | too_many_lines | empty_gift; details.assetId)" }
        "404": { $ref: "#/components/responses/Error", description: target_not_found }
        "409": { $ref: "#/components/responses/Error", description: "not_eligible (details.side self|other, action send|receive, blockers) | limit_reached (details.side, limit, cap, used, requested) | insufficient | too_many_open | self" }
        "429": { $ref: "#/components/responses/Error", description: "limit_reached (offers_per_day) | rate limit" }
  /trades/history:
    get:
      summary: Answered or lapsed offers (either side), newest first.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { offers: { type: array, items: { $ref: "#/components/schemas/TradeOffer" } } } } } }
  /trades/peer/{characterId}:
    get:
      summary: Composer helper — relation with a character, the daily received-value cap between us, and why they cannot receive now.
      security: [{ bearer: [] }]
      parameters: [{ name: characterId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradePeer" } } } }
        "404": { $ref: "#/components/responses/Error", description: target_not_found }
        "409": { $ref: "#/components/responses/Error", description: self }
  /trades/{offerId}/accept:
    post:
      summary: >-
        Accept an incoming offer (receiver). acknowledgeIrreversible must be true ("không hoàn tác"). One transaction:
        catalogue, gates, relation, daily caps and both balances are re-verified; lines move through the ledgers
        (trade_send / trade_receive) and each giver's stone fee is burned (trade_fee). A failure moves nothing and the offer
        stays pending. Idempotent by key.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [acknowledgeIrreversible], properties: { acknowledgeIrreversible: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradeView" } } } }
        "400": { $ref: "#/components/responses/Error", description: "irreversible_not_acknowledged | invalid_lines (the catalogue changed)" }
        "409": { $ref: "#/components/responses/Error", description: "offer_gone | not_eligible | limit_reached | insufficient (details.side other = the sender)" }
  /trades/{offerId}/decline:
    post:
      summary: Decline an incoming offer (receiver). Idempotent by key.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradeView" } } } }
        "409": { $ref: "#/components/responses/Error", description: offer_gone }
  /trades/{offerId}/cancel:
    post:
      summary: Withdraw my pending offer (sender). Idempotent by key.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradeView" } } } }
        "409": { $ref: "#/components/responses/Error", description: offer_gone }
  /admin/trades/flows:
    get:
      summary: >-
        Admin: abnormal one-way flows over ?days= (default trade.yaml alerts.window_days, ≤ 90) — top net receivers,
        lopsided pairs, many-to-one funnels, offers between accounts on the same network. Warnings only. Audited
        (admin_audit_logs trade.flows.read).
      security: [{ bearer: [] }]
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TradeFlows" } } } }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, example: character_not_found }
                  message: { type: string }
  schemas:
    StreakView:
      type: object
      properties:
        current: { type: integer, description: "streak still alive today (0 = broken)" }
        best: { type: integer }
        offeredToday: { type: boolean }
        nextPointsMilli: { type: integer, format: int64, description: "what the next offering pays" }
    IncenseResult:
      type: object
      properties:
        streak: { $ref: "#/components/schemas/StreakView" }
        rawMilli: { type: integer, format: int64 }
        earnedMilli: { type: integer, format: int64, description: After bucket/ceiling/bottleneck }
        vipPoints: { type: integer }
        stagesAdvanced: { type: array, items: { type: string } }
        task: { type: object, description: Daily task view (claimed) }
        cultivation: { $ref: "#/components/schemas/CultivationSnapshot" }
        replayed: { type: boolean }
    SpeedItemResult:
      type: object
      properties:
        itemId: { type: string }
        remaining: { type: integer, format: int64 }
        usesToday: { type: integer }
        maxUsesPerDay: { type: integer }
        rawMilli: { type: integer, format: int64 }
        earnedMilli: { type: integer, format: int64, description: After speed cap / bucket / ceiling / bình cảnh }
        stagesAdvanced: { type: array, items: { type: string } }
        cultivation: { $ref: "#/components/schemas/CultivationSnapshot" }
        replayed: { type: boolean }
    ShopListing:
      type: object
      properties:
        id: { type: string }
        itemId: { type: string }
        lotSize: { type: integer }
        price: { type: integer, format: int64, description: spirit stones per lot }
        dailyLimitLots: { type: integer, description: absent = no daily limit }
        minTier: { type: integer, description: "Tiên Duyên level (cosmetic listings only)" }
        name: { type: string }
        category: { type: string }
        rarity: { type: string }
        boughtTodayLots: { type: integer }
        remainingTodayLots: { type: integer, description: "-1 = no daily limit" }
        owned: { type: integer, format: int64 }
        available: { type: boolean }
        lockedReason: { type: string, enum: [tier, owned, sold_out, stones] }
    ShopView:
      type: object
      properties:
        currency: { type: string, enum: [spirit_stone] }
        balance: { type: integer, format: int64 }
        maxLotsPerOrder: { type: integer }
        tier: { type: integer }
        gameDay: { type: string, format: date }
        resetsAt: { type: string, format: date-time }
        listings: { type: array, items: { $ref: "#/components/schemas/ShopListing" } }
    BuyResult:
      type: object
      properties:
        purchaseId: { type: integer, format: int64 }
        listingId: { type: string }
        lots: { type: integer }
        totalPrice: { type: integer, format: int64 }
        item: { type: object, properties: { itemId: { type: string }, quantity: { type: integer, format: int64, description: held after the purchase } } }
        replayed: { type: boolean }
        shop: { $ref: "#/components/schemas/ShopView" }
    FortuneOutcome:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        weightBp: { type: integer, description: "disclosed chance; Σ = 10000" }
        rateBonusBp: { type: integer }
        verse: { type: string }
    FortuneView:
      type: object
      properties:
        name: { type: string }
        outcomes: { type: array, items: { $ref: "#/components/schemas/FortuneOutcome" } }
        today:
          type: [object, "null"]
          properties: { outcome: { $ref: "#/components/schemas/FortuneOutcome" }, rollBp: { type: integer }, drawnAt: { type: string, format: date-time } }
        buff:
          type: [object, "null"]
          properties: { bonusBp: { type: integer }, startsAt: { type: string, format: date-time }, endsAt: { type: string, format: date-time } }
        gameDay: { type: string, format: date }
        resetsAt: { type: string, format: date-time }
        replayed: { type: boolean }
        cultivation: { $ref: "#/components/schemas/CultivationSnapshot" }
    WorldState:
      type: object
      properties:
        startedAt: { type: [string, "null"], format: date-time }
        serverDay: { type: integer, description: "-1 before launch" }
        progressMilli: { type: integer, format: int64 }
        closedThroughDay: { type: string, format: date }
        medianPositionMilli: { type: integer, format: int64 }
        eraId: { type: string }
        lastMilestoneId: { type: string }
        pausedAt: { type: [string, "null"], format: date-time }
    WorldReached:
      type: object
      required: [id, name, reachedAt, serverDay, reason]
      properties:
        id: { type: string }
        name: { type: string }
        reachedAt: { type: string, format: date-time }
        serverDay: { type: integer }
        reason: { type: string, enum: [threshold, max_time, admin] }
    MilestoneOverride:
      type: object
      properties:
        milestoneId: { type: string }
        thresholdPointsPerActive: { type: [integer, "null"] }
        targetDay: { type: [integer, "null"] }
        forceReach: { type: boolean }
        paused: { type: boolean }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    FactionView:
      type: object
      required: [id, name, namePlaceholder, allowedPaths, color, open, members, meritMilli, meritRank]
      properties:
        id: { type: string }
        name: { type: string }
        namePlaceholder: { type: boolean }
        allowedPaths: { type: array, items: { type: string } }
        openFromEra: { type: string, description: "omitted = never open (canon not decided)" }
        closeFromEra: { type: string }
        color: { type: string, description: "design token suffix → var(--color-<color>)" }
        motto: { type: string }
        pitch: { type: string }
        open: { type: boolean, description: joinable in the current era }
        members: { type: integer }
        meritMilli: { type: integer, description: "Σ world-countable points (min(100, credited − ×2 bonus) per member-day, milli) since meritSince" }
        meritRank: { type: integer, description: "1-based among open or populated factions; 0 = unranked" }
    FactionList:
      type: object
      required: [factions, switchCooldownSeconds, eraId, meritSince, rankingAvailable]
      properties:
        factions: { type: array, items: { $ref: "#/components/schemas/FactionView" } }
        switchCooldownSeconds: { type: integer }
        eraId: { type: string }
        meritSince: { type: [string, "null"], format: date, description: first game day counted toward merit }
        rankingAvailable: { type: boolean }
    FactionEffectNotice:
      type: object
      required: [kind, from, dueAt]
      properties:
        kind: { type: string, enum: [split_faction, migrate_faction] }
        from: { type: string }
        into: { type: array, items: { type: string } }
        to: { type: string }
        dueAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
    FactionHistoryEntry:
      type: object
      required: [from, to, reason, createdAt]
      properties:
        from: { type: [string, "null"] }
        to: { type: string }
        fromPath: { type: string }
        toPath: { type: string }
        reason: { type: string, enum: [join, switch, split_choice, split_default, auto_migrate, reincarnation, admin] }
        createdAt: { type: string, format: date-time }
    FactionMembership:
      type: object
      required: [factionId, joinedAt, canSwitchAt, switchCooldownSeconds, locked, mustChoose, chooseDeadline, path, stageId, upcoming, history]
      properties:
        factionId: { type: [string, "null"] }
        joinedAt: { type: [string, "null"], format: date-time }
        canSwitchAt: { type: [string, "null"], format: date-time, description: "null = a switch is allowed now" }
        switchCooldownSeconds: { type: integer }
        locked: { type: boolean }
        lockReason: { type: string, enum: [fengshen, admin, event] }
        lockedUntil: { type: [string, "null"], format: date-time }
        mustChoose: { type: array, items: { type: string }, description: "branches of a pending split; empty = none" }
        chooseDeadline: { type: [string, "null"], format: date-time }
        path: { type: string }
        stageId: { type: string }
        upcoming: { oneOf: [{ $ref: "#/components/schemas/FactionEffectNotice" }, { type: "null" }] }
        history: { type: array, items: { $ref: "#/components/schemas/FactionHistoryEntry" } }
    FactionChangeRequest:
      type: object
      required: [factionId]
      additionalProperties: false
      properties:
        factionId: { type: string }
        path: { type: string, description: "optional path choice; must be one of the faction's allowedPaths" }
    FactionChangeResult:
      type: object
      required: [membership, replayed]
      properties:
        membership: { $ref: "#/components/schemas/FactionMembership" }
        replayed: { type: boolean }
    FactionMembersPage:
      type: object
      required: [factionId, entries, total, nextCursor]
      properties:
        factionId: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [rank, characterId, name, stageId]
            properties:
              rank: { type: integer }
              characterId: { type: string, format: uuid }
              name: { type: string }
              stageId: { type: string }
