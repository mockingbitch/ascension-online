        progress:
          type: object
          properties:
            perActiveMilli: { type: integer, format: int64, description: "Σ closed per-capita days since launch" }
            closedThroughDay: { type: string, format: date }
            todayProvisionalMilli: { type: integer, format: int64, description: "today's running per-capita (not counted yet)" }
