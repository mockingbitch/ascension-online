        lockedUntil: { type: [string, "null"], format: date-time }
    WorldView:
      type: object
      required: [started, startedAt, serverDay, paused, era, progress, lastMilestone, nextMilestone, activeEvents, pendingEffects, timeline]
      properties:
        started: { type: boolean }
        startedAt: { type: [string, "null"], format: date-time }
