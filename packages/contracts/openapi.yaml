                thresholdPerActiveMilli: { type: integer, format: int64 }
                progressBp: { type: integer, minimum: 0, maximum: 10000 }
                earliestAt: { type: [string, "null"], format: date-time, description: "70% floor" }
                latestAt: { type: [string, "null"], format: date-time, description: "150% ceiling" }
                estimatedAt: { type: [string, "null"], format: date-time, description: "avg of last 7 closed days, clamped" }
        activeEvents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              milestoneId: { type: string }
              name: { type: string }
              startedAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
