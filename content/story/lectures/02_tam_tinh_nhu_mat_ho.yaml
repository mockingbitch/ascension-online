# Tử Tiêu Cung, bài giảng 2/8 (vòng đầu). Định dạng và quy tắc: README.md cùng thư mục.
id: tam_tinh_nhu_mat_ho
order: 2
title: Tâm tĩnh như mặt hồ
theme: Giữ tâm bình lặng
lines:
  - text: "Ngồi xuống đi. Đừng vội nghe ta. Trước hết hãy nghe tiếng thở của chính mình."
    seconds: 9
  - text: "Có một mặt hồ ta thường ngồi ngắm. Ngày lặng gió, nó soi rõ từng đám mây trôi qua."
    seconds: 10
  - text: "Ngày nổi gió, mặt hồ vẫn là mặt hồ ấy. Chỉ là nó gợn sóng, nên chẳng soi được gì nữa."
    seconds: 11
  - text: "Tâm người tu cũng thế. Không phải tâm ngươi kém đi. Chỉ là nó đang động."
    seconds: 9
  - text: "Hồ không cần biến thành thứ gì khác mới trong lại. Nó chỉ cần được yên một lúc. Tâm ngươi cũng vậy."
    seconds: 11
  - text: "Khi tâm động, ngươi nhìn một việc nhỏ thành việc lớn, nhìn một lời nói vô tình thành mũi tên."
    seconds: 10
  - text: "Ngươi vội đột phá khi căn cơ chưa vững. Ngươi nói lời nặng với đạo hữu rồi cả đêm hối hận."
    seconds: 11
  - text: "Người tu gọi những con sóng ấy là tâm ma. Tâm ma không đến từ bên ngoài. Nó lớn lên từ chính những gì ngươi nuôi."
    seconds: 12
  - text: "Vậy làm sao cho hồ lặng? Đừng lấy tay đè sóng xuống. Càng đè, nước càng tung tóe."
    seconds: 9
  - text: "Hãy để gió đi qua. Hãy nhìn con sóng, gọi tên nó, rồi chờ. Sóng nào rồi cũng lặng."
    seconds: 10
  - text: "Khi giận, hãy thầm nói: ta đang giận. Gọi được tên nó, ngươi đã đứng ra ngoài nó một bước."
    seconds: 10
  - text: "Khi lo, hãy hỏi: việc này ta làm được gì ngay lúc này? Làm phần ấy, phần còn lại để trời đất lo."
    seconds: 11
  - text: "Có một phép rất đơn giản. Thở vào chậm, đếm đến bốn. Thở ra chậm hơn, đếm đến sáu."
    seconds: 10
  - text: "Làm vậy vài lần, linh khí trong người sẽ tự trôi về chỗ của nó. Ở cõi phàm, người ta gọi đó là bình tĩnh lại."
    seconds: 12
  - text: "Tâm tĩnh không có nghĩa là không cảm thấy gì. Người tĩnh vẫn buồn, vẫn vui, vẫn thương."
    seconds: 9
  - text: "Chỉ là họ không để một cơn sóng cuốn đi cả mặt hồ, và không để một ngày tồi tệ cuốn đi cả con đường."
    seconds: 12
  - text: "Ngồi thiền trong động phủ là để luyện điều ấy. Không phải để trốn đời, mà để trở lại đời với đôi mắt trong hơn."
    seconds: 12
  - text: "Trước khi đột phá, hãy làm hồ lặng trước. Quyết định đúng hiếm khi sinh ra từ một trái tim đang dậy sóng."
    seconds: 11
  - text: "Trước khi trả lời một lời khó nghe, cũng hãy làm hồ lặng trước. Chờ ba hơi thở thôi, lời ngươi sẽ khác."
    seconds: 11
  - text: "Ngoài đời cũng vậy. Một bức thư viết lúc giận, hãy để qua đêm rồi hẵng gửi."
    seconds: 9
  - text: "Bao nhiêu điều hối tiếc trên đời chỉ vì thiếu một khoảng lặng ngắn giữa lúc nghe và lúc đáp."
    seconds: 11
  - text: "Đừng mong tâm lặng mãi. Gió sẽ còn nổi, vì ngươi còn sống, còn quan tâm, còn muốn đi xa."
    seconds: 10
  - text: "Chỉ cần mỗi lần sóng nổi, ngươi trở về với hơi thở nhanh hơn lần trước một chút."
    seconds: 9
  - text: "Đó là tu vi của tâm. Không bia đá nào khắc được nó, nhưng nó theo ngươi qua mọi cảnh giới."
    seconds: 11
  - text: "Giờ hãy nhắm mắt một hơi. Nghe tiếng thở. Nghe sự im lặng của đại điện."
    seconds: 9
  - text: "Bao nhiêu người đang ngồi đây, mà điện vẫn tĩnh. Vì mỗi người đang giữ yên mặt hồ của riêng mình."
    seconds: 11
  - text: "Mang sự tĩnh ấy theo khi rời điện. Nó nhẹ lắm, không chiếm chỗ nào trong túi đồ của ngươi."
    seconds: 10
question: "Lần gần nhất tâm ngươi dậy sóng là vì điều gì? Nếu khi ấy ngươi chờ ba hơi thở, ngươi sẽ làm khác đi thế nào?"
takeaway: "Đừng đè sóng trong lòng xuống, hãy gọi tên nó, thở chậm và chờ, vì hồ có lặng thì mới soi rõ đường đi."
