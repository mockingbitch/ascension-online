# Tử Tiêu Cung, bài giảng 8/8 (vòng đầu). Câu áp chót dẫn vòng giảng quay lại bài 1.
# Định dạng và quy tắc: README.md cùng thư mục.
id: buoc_qua_nguong_cua
order: 8
title: Bước qua ngưỡng cửa
theme: Can đảm đột phá
lines:
  - text: "Hôm nay ta nói về khoảnh khắc khó nhất trên đường tu. Không phải lúc khổ luyện, mà là lúc đứng trước ngưỡng cửa."
    seconds: 12
  - text: "Tu vi đã đủ, căn cơ đã vững. Chỉ còn một bước. Vậy mà rất nhiều người đứng đó rất lâu, không dám bước."
    seconds: 12
  - text: "Ta hiểu vì sao. Bên này ngưỡng cửa là thứ ngươi đã quen. Bên kia là thứ ngươi chưa biết."
    seconds: 10
  - text: "Ngưỡng cửa nào cũng vậy, từ Luyện Khí lên Trúc Cơ cho đến những tầng trời mà các ngươi chưa thấy."
    seconds: 11
  - text: "Sợ hãi lúc ấy là chuyện thường. Người không biết sợ chưa chắc đã can đảm. Có khi họ chỉ chưa hiểu mình đang làm gì."
    seconds: 12
  - text: "Can đảm là biết mình sợ, nhìn thẳng vào nỗi sợ, rồi vẫn bước. Bước chậm cũng được, run cũng được."
    seconds: 11
  - text: "Nhưng can đảm khác với liều lĩnh. Kẻ liều lĩnh bước khi chưa chuẩn bị. Người can đảm chuẩn bị xong rồi mới bước."
    seconds: 12
  - text: "Vậy hãy chuẩn bị. Tích đủ tu vi, giữ tâm cho lặng, nghỉ ngơi cho đủ. Những điều ta đã giảng, chính là để dành cho lúc này."
    seconds: 13
  - text: "Rồi đến một lúc, chuẩn bị thêm cũng không làm ngươi chắc chắn hơn. Lúc ấy, chờ đợi chỉ còn là một cách trốn."
    seconds: 12
  - text: "Không ai đột phá thay ngươi được. Ta không, đạo hữu của ngươi không, Thiên Bảng cũng không. Bước ấy là của ngươi."
    seconds: 11
  - text: "Người khác có thể tiễn ngươi đến cửa, chúc ngươi bình an. Nhưng qua cửa thì chỉ có đôi chân ngươi."
    seconds: 11
  - text: "Và cũng không ai được hối thúc ngươi. Ngươi bước khi ngươi đã sẵn sàng, không phải khi người khác bảo ngươi phải bước."
    seconds: 12
  - text: "Hãy nghĩ thế này: dù kết quả ra sao, ngươi của sau bước ấy đã khác ngươi của trước. Người đã dám thử thì không còn như cũ."
    seconds: 13
  - text: "Nếu thành, ngươi sẽ thấy một bầu trời rộng hơn. Nếu chưa thành, ngươi biết rõ hơn mình cần gì. Không có bước nào là phí."
    seconds: 12
  - text: "Thứ thật sự mất đi, là những bước ngươi chưa từng dám bước. Chúng chẳng để lại gì, kể cả bài học."
    seconds: 11
  - text: "Ở đời cũng thế. Lời xin lỗi chưa nói, việc mới chưa dám làm, người bạn chưa dám bắt chuyện. Ngưỡng cửa ở khắp nơi."
    seconds: 12
  - text: "Mỗi ngưỡng cửa vượt qua đều làm ngươi rộng thêm một chút, dù chẳng có tấm bia nào ghi lại."
    seconds: 10
  - text: "Khi sấm sét giáng xuống, đừng nhắm mắt. Hãy nhìn nó. Sấm sét chỉ là trời đất hỏi ngươi: ngươi đã sẵn sàng chưa?"
    seconds: 12
  - text: "Hãy trả lời bằng tất cả những ngày ngươi đã tu: những giọt linh khí nhỏ, những lần tâm lặng, những lần đứng dậy."
    seconds: 12
  - text: "Ngươi không bước vào lôi kiếp một mình. Mọi ngày ngươi đã sống đều đứng sau lưng ngươi."
    seconds: 9
  - text: "Và nếu lần này trời chưa thuận, hãy quay lại đại điện. Ta vẫn ngồi đây. Bài giảng lại bắt đầu từ giọt linh khí đầu tiên."
    seconds: 13
  - text: "Đạo không có điểm cuối. Mỗi cảnh giới vượt qua chỉ mở ra một ngưỡng cửa mới. Đó không phải là gánh nặng. Đó là niềm vui."
    seconds: 13
  - text: "Ta đã nói xong. Phần còn lại không nằm trong lời ta. Nó nằm ở bước chân tiếp theo của ngươi."
    seconds: 11
  - text: "Đứng dậy đi. Ngưỡng cửa đang chờ."
    seconds: 8
question: "Có ngưỡng cửa nào ngươi đã chuẩn bị đủ mà vẫn chưa dám bước qua? Điều gì đang giữ chân ngươi lại?"
takeaway: "Can đảm là biết mình sợ mà vẫn bước sau khi đã chuẩn bị, vì chỉ những bước chưa dám đi mới thật sự mất."
