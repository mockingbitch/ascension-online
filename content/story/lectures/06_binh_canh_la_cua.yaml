# Tử Tiêu Cung, bài giảng 6/8 (vòng đầu). Định dạng và quy tắc: README.md cùng thư mục.
id: binh_canh_la_cua
order: 6
title: Bình cảnh là cửa, không phải tường
theme: Chấp nhận thất bại
lines:
  - text: "Có người đang ngồi đây với một nỗi buồn. Ngươi vừa đột phá thất bại. Ta biết. Cứ ngồi yên mà nghe."
    seconds: 11
  - text: "Mọi người tu đều sẽ gặp bình cảnh. Không có ngoại lệ, kể cả những cái tên cao nhất trên Thiên Bảng."
    seconds: 11
  - text: "Bình cảnh giống như khúc sông gặp ghềnh đá. Nước dồn lại, đục ngầu, tưởng như không chảy nữa."
    seconds: 10
  - text: "Nhưng chính lúc dồn lại ấy, nước đang tích sức. Đủ sức rồi, nó sẽ tràn qua đá, và dòng sông phía sau rộng hơn."
    seconds: 12
  - text: "Cho nên bình cảnh không phải là bức tường. Nó là một cánh cửa, chỉ là cửa ấy nặng hơn những cửa trước."
    seconds: 11
  - text: "Thất bại một lần không lấy đi những gì ngươi đã là. Cảnh giới của ngươi vẫn còn đó. Căn cơ của ngươi vẫn còn đó."
    seconds: 12
  - text: "Ở những cảnh giới cao, lôi kiếp có thể làm hao tổn một phần tu vi. Ta không giấu các ngươi điều ấy."
    seconds: 11
  - text: "Nhưng thứ hao đi là thứ tích lại được. Thứ ngươi học được dưới sấm sét thì không tia sét nào lấy lại."
    seconds: 11
  - text: "Và trời đất không để ai thua mãi. Ai ngã đủ số lần, trời sẽ mở đường cho lần đứng dậy kế tiếp."
    seconds: 11
  - text: "Mỗi lần thất bại đều để lại dấu. Lần sau, ngươi bước vào với nhiều hơn, chứ không ít hơn."
    seconds: 10
  - text: "Điều ta lo không phải là ngươi thất bại. Điều ta lo là ngươi nghĩ thất bại nói lên ngươi là ai."
    seconds: 11
  - text: "Nó không nói điều đó. Nó chỉ nói rằng lần này chưa thành. Hai chuyện ấy khác nhau xa lắm."
    seconds: 10
  - text: "Ngươi không phải là lần thất bại ấy. Ngươi là người đã dám thử. Mà dám thử thì đã hơn rất nhiều kẻ chỉ đứng nhìn."
    seconds: 12
  - text: "Khi vấp, hãy làm ba việc. Thứ nhất, nghỉ một chút. Đừng lao vào thử lại ngay khi lòng còn nóng."
    seconds: 11
  - text: "Thứ hai, nhìn lại. Căn cơ đã đủ dày chưa? Tâm đã đủ lặng chưa? Có thứ gì ngươi đã bỏ qua?"
    seconds: 11
  - text: "Thứ ba, thử lại. Không phải vì ngươi chắc chắn sẽ thành, mà vì người tu đạo là người biết đứng dậy."
    seconds: 11
  - text: "Trong lúc chờ, cứ tu luyện như thường. Tu vi tích thêm mỗi ngày chính là lớp đá kê chân cho lần thử sau."
    seconds: 11
  - text: "Ngoài đời cũng thế. Kỳ thi trượt, việc làm hỏng, lời hứa chưa giữ được. Đó là ghềnh đá, không phải cuối sông."
    seconds: 11
  - text: "Người ngươi ngưỡng mộ nhất, hãy hỏi họ đã thất bại bao nhiêu lần. Con số ấy sẽ làm ngươi bất ngờ."
    seconds: 11
  - text: "Nếu có đạo hữu vừa vấp ngã, đừng nói với họ: lẽ ra ngươi phải thế này thế kia. Hãy nói: ta cũng từng như vậy."
    seconds: 12
  - text: "Một câu như thế nhẹ như lông hồng, mà đỡ được cả một người đang ngã."
    seconds: 9
  - text: "Trong Tử Tiêu Cung này, không ai bị cười vì đã ngã. Ở đây, người ta chỉ nhớ ai đã đứng dậy."
    seconds: 11
  - text: "Còn với chính mình, hãy nói điều ngươi sẽ nói với một người bạn. Đừng nghiêm khắc với mình hơn với bất kỳ ai."
    seconds: 12
  - text: "Khi ngươi đột phá thành công, ngươi sẽ nhận ra: những lần thất bại trước không hề uổng. Chúng là bậc thang."
    seconds: 11
  - text: "Hôm nay chưa qua được thì cứ nghỉ đi. Cửa vẫn ở đó. Cửa không đi đâu cả. Ngươi cũng đừng đi đâu cả."
    seconds: 12
question: "Lần vấp ngã gần nhất của ngươi, trên đường tu hay ngoài đời, đã dạy ngươi điều gì mà thành công không dạy được?"
takeaway: "Bình cảnh là cửa chứ không phải tường: thất bại chỉ nói lần này chưa thành, không nói ngươi là ai."
