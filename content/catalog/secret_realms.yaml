# Secret realm (bí cảnh thử luyện) catalogue — the resource mini game (cot-truyen §5.5, plan §3.8, checklist §3.4).
# Loaded by services/game/internal/secretrealm; cross-checked against items.yaml / realms.yaml in content.LoadAll.
# Rules: docs/design/bi-canh-luat-choi.md. Decision: docs/decisions.md 2026-11-07 "Bí cảnh thử luyện + pháp bảo".
#
# Kept SEPARATE from trials.yaml on purpose: a trial is a breakthrough gate (pass, gate tier, lose cooldown, kept until
# the breakthrough succeeds); a secret realm is a daily resource run (runs/day, loot, daily reward caps). Both reuse the
# same verification pattern: server-issued seed, params snapshot per run, deterministic replay of the client's log.
#
# Fairness (non-negotiable 3): NOTHING here depends on Tiên Duyên. Runs/day, loot and caps are the same for everyone.
# Pháp bảo (tribulation odds) drop ONLY here — never sold for stones or money (shop.yaml cross-check), never tradable.
#
# Units: *_seconds server clock · *_ticks simulation ticks (params.tick_ms each) · *_bp basis points (10000 = 100%) ·
#        positions/radii in arena units · *_sub in 1/16 unit per tick.
#
# ⚠ Every number below is a first guess for closed-beta tuning (decisions entry lists them).
version: 1

realms:
  - id: hoang_co
    name: Hoang Cổ Bí Cảnh
    summary: Kết giới cổ mở ra một khe nứt. Tà khí ùa vào từ bốn phía — giữ vững hộ thể, để phi kiếm tự tìm đường, gom linh khí rơi lại.
    engine: bi_canh
    min_tier: 1                         # open from Luyện Khí
    runs_per_day: 3                     # lượt/ngày per character across all realms (game day UTC+7 of the START); abandoned runs count
    expire_after_seconds: 240           # 150 s of play + 90 s slack: a known seed can be retried locally ≤ ~1.6× (M1)
    min_elapsed_bp: 9000                # server time ≥ 90% of the simulated time, else too_fast
    min_reward_ticks: 600               # a run shorter than 30 s earns nothing (min-run floor)
    params:
      rules_version: 1
      tick_ms: 50                       # 20 ticks/s
      time_limit_ticks: 3000            # 150 s
      arena: { width: 640, height: 640 }
      player: { radius: 10, speed_sub: 80, hp: 6, invuln_ticks: 24 }      # 5 units/tick; 6 hộ thể; 1.2 s after a hit
      sword: { range: 230, speed_sub: 240, radius: 5, life_ticks: 22, damage: 1 }
      orbit: { radius: 46, blade_radius: 7, step: 2, damage: 1, hit_cooldown_ticks: 10 }
      levels:                           # kiếm ý: linh khí gathered → faster phi kiếm, then kiếm trận blades
        - { qi: 0,   fire_every: 14, orbit: 0 }
        - { qi: 10,  fire_every: 12, orbit: 0 }
        - { qi: 30,  fire_every: 11, orbit: 1 }
        - { qi: 60,  fire_every: 10, orbit: 2 }
        - { qi: 110, fire_every: 9,  orbit: 2 }
        - { qi: 180, fire_every: 8,  orbit: 3 }
      spawn: { start_ticks: 28, min_ticks: 8, step_every_ticks: 140, wave_max: 4, wave_grow_every_ticks: 600, max_enemies: 80, safe_radius: 120 }
      enemies:                          # original tà khí; nothing from an existing game
        - { id: am_hon,    name: Âm Hồn,    weight: 6, from_tick: 0,   hp: 1,  speed_sub: 28, radius: 8,  points: 1 }
        - { id: hoa_linh,  name: Hỏa Linh,  weight: 3, from_tick: 400, hp: 1,  speed_sub: 46, radius: 6,  points: 2 }
        - { id: thach_quy, name: Thạch Quỷ, weight: 2, from_tick: 900, hp: 4,  speed_sub: 20, radius: 13, points: 4 }
        - { id: ta_tuong,  name: Tà Tướng,  weight: 0, from_tick: 0,   hp: 24, speed_sub: 16, radius: 18, points: 15, at_ticks: [1200, 2100, 2700] }
      orbs: { pickup_radius: 22, magnet_radius: 72, magnet_speed_sub: 112, life_ticks: 500, max: 90 }
      max_swords: 12
      input_window_ticks: 20            # human cadence: ≤ 8 direction changes in any 1 s window (recorder defers more)
      max_changes_per_window: 8
      max_runs: 1500                    # RLE entries; × ~10 bytes fits secretrealm.MaxClaimBytes (loader-checked)

    # Result bands by the REPLAYED run (highest match): score AND linh khí picked up AND spirits defeated — every band
    # needs real play (anti-cheat M4). Measured over 100 seeds: blind scripts (standing still, fixed 8-direction loops of
    # 10–100 ticks, back-and-forth, squares) reach qi ≤ 195 and kills ≤ 178 at P99, score ≤ 446; the human-cadence
    # reference player has qi ≥ 273 and kills ≥ 219 at P5 (all three paces). Below the lowest band (or < min_reward_ticks):
    # nothing.
    bands:
      - { id: ha,     name: Hạ Phẩm,     min_score: 450, min_qi: 200, min_kills: 180 }
      - { id: trung,  name: Trung Phẩm,  min_score: 650, min_qi: 250, min_kills: 220 }
      - { id: thuong, name: Thượng Phẩm, min_score: 900, min_qi: 300, min_kills: 250 }

    # Loot per band (uniform integer in [min, max]); `survived` adds on top when the run reached the time limit.
    loot:
      ha:     { spirit_stone: { min: 10, max: 20 }, items: [{ item_id: linh_thao, min: 1, max: 3 }], artifact_chance_bp: 0 }
      trung:  { spirit_stone: { min: 25, max: 35 }, items: [{ item_id: linh_thao, min: 2, max: 4 }], artifact_chance_bp: 50 }
      thuong: { spirit_stone: { min: 35, max: 50 }, items: [{ item_id: linh_thao, min: 3, max: 5 }], artifact_chance_bp: 150 }
    survived: { spirit_stone: 10, artifact_chance_bp: 150 }   # best run: 3% pháp bảo → ~1 per 11 days at 3 runs/day

    # Pháp bảo drop table (weights). A pháp bảo the character already owns turns into duplicate_stones linh thạch
    # (still inside the daily stone cap).
    artifacts:
      - { item_id: thanh_dong_kinh, weight: 50, duplicate_stones: 30 }
      - { item_id: ty_loi_chau,     weight: 28, duplicate_stones: 50 }
      - { item_id: loi_van_phu,     weight: 14, duplicate_stones: 80 }
      - { item_id: huyen_vu_thuan,  weight: 6,  duplicate_stones: 120 }
      - { item_id: cuu_tieu_hoan,   weight: 2,  duplicate_stones: 200 }

    # Daily reward caps per character across ALL realms (game day of the submit). Loot beyond a cap is clipped and disclosed.
    daily_caps: { spirit_stone: 120, materials: 30, artifacts: 1 }   # 120 ≤ 3 × a good run: the cap binds for decent players
