# Cosmetics (decisions 2026-11-07 "Linh thạch sinks"): titles, portrait frames, chat name effects and cave
# decorations. Loaded by internal/cosmetic; cross-checked in content.LoadAll (vip.yaml perks, world eras).
#
# NO GAMEPLAY EFFECT. A cosmetic changes how a character LOOKS to others — never cultivation rate, points,
# breakthrough/tribulation odds, ranking, faction merit or điểm duyên. The loader REJECTS any effect-like field on an
# entry (`*_bp`, `*_milli`, `*_hours`, `*_seconds`, every items.yaml effect key): `make content-check` fails.
#
# IDs: the full id is "<kind>:<slug>" — the SAME id space as vip.yaml perks (`title:vip_1`, `avatar_frame:ngoc`,
#   `chat_aura:linh_quang`, `cave_decoration:van_hac`). Every such perk must resolve to a `source: tien_duyen` entry
#   here and every tien_duyen entry must be granted by exactly one tier (cross-check). Slugs are unique across the
#   whole file (and faction_works.yaml decorations): the web art slot is `cosmetics/<slug>`.
# kind: title | avatar_frame | chat_aura | cave_decoration   (one equipped title/frame/chat aura; settings.cave_slots
#   decorations at once).
# source: shop (default; bought with spirit stones) | tien_duyen (granted by the Tiên Duyên level; no price).
# price: spirit stones, STRICTLY increasing within a shop series (escalating ladder). min_tier: optional Tiên Duyên
#   gate — allowed here because cosmetics never decide progress (CLAUDE.md non-negotiable 3).
# Availability window (shop series only; owned items stay usable forever):
#   season: xuan | ha | thu | dong — game-day month (UTC+7) inside the season's months;
#   from_era / until_era: world era range (world_milestones.yaml eras; before launch the first era applies).
#
# ⚠️ PRICES ARE PLACEHOLDERS awaiting owner sign-off (docs/decisions.md 2026-11-07 "Linh thạch sinks").
version: 1
settings:
  currency: spirit_stone
  cave_slots: 4
seasons:
  - { id: xuan, name: Xuân, months: [2, 3, 4] }
  - { id: ha,   name: Hạ,   months: [5, 6, 7] }
  - { id: thu,  name: Thu,  months: [8, 9, 10] }
  - { id: dong, name: Đông, months: [11, 12, 1] }

