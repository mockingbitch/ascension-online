    # Tam Hoàng Ngũ Đế (Phục Hy, Thần Nông, Hiên Viên above)
    - { term: "tam hoàng ngũ đế",      match: word_exact, category: story }
    - { term: "toại nhân",             match: name_exact, category: story }
    - { term: "hữu sào",               match: name_exact, category: story }
    - { term: "thiếu hạo",             match: word_exact, category: story }
    - { term: "chuyên húc",            match: word_exact, category: story }
    - { term: "đế khốc",               match: word_exact, category: story }
    - { term: "đế nghiêu",             match: word_exact, category: story }
    - { term: "đường nghiêu",          match: word_exact, category: story }
