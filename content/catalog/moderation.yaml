# Name moderation + player reports (Phase 1.5). Loaded by internal/moderation, validated at startup.
#
# NAME RULES — checked on character creation and on admin rename (after the format check in character.NormalizeName).
# Every name and every term is normalised the same way before comparing:
#   NFKD (folds fullwidth/compat letters) → lowercase → Latin lookalikes folded (ø→o, ł→l, ß→ss…) → runs of the same
#   letter squeezed ("fuuuck" → "fuck", "lồnnn" → "lồn").
# match:
#   word        accent-insensitive whole-word sequence. "dit me" blocks "Địt Mẹ", "Dit Me", "Ông Đít Mẹ Hai".
#               Use only when the accentless form is not an ordinary name syllable.
#   word_exact  tone-sensitive whole-word sequence (tone-mark placement "hoà"/"hòa" does not matter; đ ≠ d).
#               Use for single syllables whose accentless form is common in names (lồn ≠ Long/Lôn, đĩ ≠ Di).
#               The term must carry at least one diacritic.
#   name_exact  tone-sensitive, the WHOLE name equals the term. For story names that are also common real names
#               ("Hồng Quân" is blocked, "Nguyễn Hồng Quân" is allowed).
#   contains    accent-insensitive substring after removing spaces ("Đ ị t M ẹ" → "ditme"). Min 4 letters; use only
#               for strings that cannot appear inside a decent name.
# category: profanity | impersonation | story | religion | political — picks the error message shown to the player.
#
# Story names follow cot-truyen.md (canon names are used in game since the owner reversed D2 on 2026-11-07); any new
# canon figure or faction that appears in content gets a rule here in the same PR.
# The political/religion lists must be reviewed by legal + the faith reviewer (plan Phase 0) before open beta.
version: 1

names:
  rules:
    # ── profanity: Vietnamese, tone-sensitive single syllables ──
    - { term: "địt",   match: word_exact, category: profanity }
    - { term: "đụ",    match: word_exact, category: profanity }
    - { term: "đéo",   match: word_exact, category: profanity }
    - { term: "lồn",   match: word_exact, category: profanity }
    - { term: "cặc",   match: word_exact, category: profanity }
    - { term: "buồi",  match: word_exact, category: profanity }
    - { term: "đĩ",    match: word_exact, category: profanity }
    - { term: "điếm",  match: word_exact, category: profanity }
    - { term: "phò",   match: word_exact, category: profanity }
    - { term: "chịch", match: word_exact, category: profanity }
    - { term: "nứng",  match: word_exact, category: profanity }
    - { term: "đù",    match: word_exact, category: profanity }
    # ── profanity: accent-insensitive phrases / abbreviations ──
    - { term: "dit",       match: word, category: profanity }
    - { term: "dit me",    match: word, category: profanity }
    - { term: "du ma",     match: word, category: profanity }
    - { term: "du me",     match: word, category: profanity }
    - { term: "deo me",    match: word, category: profanity }
    - { term: "mẹ mày",    match: word_exact, category: profanity }
    - { term: "cha mày",   match: word_exact, category: profanity }
    - { term: "oc cho",    match: word, category: profanity }
    - { term: "cho de",    match: word, category: profanity }
    - { term: "suc vat",   match: word, category: profanity }
    - { term: "cave",      match: word, category: profanity }
    - { term: "loz",       match: word, category: profanity }
    - { term: "dm",        match: word, category: profanity }
    - { term: "dcm",       match: word, category: profanity }
    - { term: "dkm",       match: word, category: profanity }
    - { term: "vcl",       match: word, category: profanity }
    - { term: "vkl",       match: word, category: profanity }
    - { term: "clm",       match: word, category: profanity }
    - { term: "cmm",       match: word, category: profanity }
    - { term: "cl",        match: word, category: profanity }
    - { term: "dick",      match: word, category: profanity }
    - { term: "cunt",      match: word, category: profanity }
    - { term: "sex",       match: word, category: profanity }
    - { term: "sexy",      match: word, category: profanity }
    - { term: "nazi",      match: word, category: profanity }
    # ── profanity: no-space evasions ──
    - { term: "ditme",   match: contains, category: profanity }
    - { term: "ditmay",  match: contains, category: profanity }
    - { term: "dume",    match: contains, category: profanity }
    - { term: "duma",    match: contains, category: profanity }
    - { term: "fuck",    match: contains, category: profanity }
    - { term: "shit",    match: contains, category: profanity }
    - { term: "bitch",   match: contains, category: profanity }
    - { term: "pussy",   match: contains, category: profanity }
    - { term: "porn",    match: contains, category: profanity }
    - { term: "nigger",  match: contains, category: profanity }
    - { term: "nigga",   match: contains, category: profanity }
    - { term: "hitler",  match: contains, category: profanity }

    # ── impersonation of staff / system ──
    - { term: "admin",          match: contains,   category: impersonation }
    - { term: "moderator",      match: contains,   category: impersonation }
    - { term: "gm",             match: word,       category: impersonation }
    - { term: "mod",            match: word,       category: impersonation }
    - { term: "cskh",           match: word,       category: impersonation }
    - { term: "support",        match: word,       category: impersonation }
    - { term: "quan tri",       match: word,       category: impersonation }
    - { term: "ban quan tri",   match: word,       category: impersonation }
    - { term: "he thong",       match: word,       category: impersonation }
    - { term: "thong bao",      match: word,       category: impersonation }
    - { term: "tiên đạo",       match: word_exact, category: impersonation }
    - { term: "thiên đạo",      match: word_exact, category: impersonation }

    # ── story characters (cot-truyen.md) ──
    - { term: "hồng quân",             match: name_exact, category: story }
    - { term: "vân khê",               match: name_exact, category: story }   # tutorial guide (decisions 2026-11-09 #1)
    - { term: "van khe",               match: word,       category: story }   # same, without diacritics
    - { term: "hồng quân lão tổ",      match: word_exact, category: story }
    - { term: "đạo tổ",                match: word_exact, category: story }
    - { term: "bàn cổ",                match: word_exact, category: story }
    - { term: "nữ oa",                 match: word_exact, category: story }
    - { term: "oa hoàng",              match: word_exact, category: story }
    - { term: "phục hy",               match: name_exact, category: story }
    - { term: "thần nông",             match: name_exact, category: story }
    - { term: "hiên viên",             match: name_exact, category: story }
    - { term: "đông vương công",       match: word_exact, category: story }
    - { term: "tây vương mẫu",         match: word_exact, category: story }
    - { term: "đế tuấn",               match: word_exact, category: story }
    - { term: "thái nhất",             match: name_exact, category: story }
    - { term: "đông hoàng thái nhất",  match: word_exact, category: story }
    - { term: "hậu thổ",               match: word_exact, category: story }
    - { term: "tổ vu",                 match: word_exact, category: story }
    - { term: "tiếp dẫn",              match: name_exact, category: story }
    - { term: "chuẩn đề",              match: word_exact, category: story }
    - { term: "tam thanh",             match: word,       category: story }
    - { term: "lão tử",                match: name_exact, category: story }
    - { term: "thái thanh",            match: name_exact, category: story }
    - { term: "thái thượng lão quân",  match: word_exact, category: story }
    - { term: "nguyên thủy thiên tôn", match: word_exact, category: story }
    - { term: "thông thiên giáo chủ",  match: word_exact, category: story }
    - { term: "thái thanh lão tử",     match: word_exact, category: story }
    - { term: "thái thượng",           match: name_exact, category: story }
    - { term: "lão quân",              match: name_exact, category: story }
    - { term: "nguyên thủy",           match: name_exact, category: story }
    - { term: "thông thiên",           match: name_exact, category: story }
    - { term: "tiếp dẫn đạo nhân",     match: word_exact, category: story }
    - { term: "đông hoa đế quân",      match: word_exact, category: story }
    - { term: "côn bằng",              match: word_exact, category: story }
    # Tổ Vu (classic Hồng Hoang roster; cot-truyen.md names only Hậu Thổ)
    - { term: "đế giang",              match: word_exact, category: story }
    - { term: "chúc dung",             match: word_exact, category: story }
    - { term: "cộng công",             match: word_exact, category: story }
