# PLAYER REPORTS — POST /reports. Reasons are a fixed enum in code + DB (offensive_name, harassment).
reports:
  daily_limit: 10        # reports one account may file per game day (dedupe: one OPEN report per target+reason)
  note_max_chars: 500    # optional free text; DB hard limit is 1000
