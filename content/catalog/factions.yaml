# Factions (thế lực) — data model §6. Loaded by internal/faction; cross-checked in content.LoadAll against
# realms.yaml paths, world_milestones.yaml eras and every split_faction / migrate_faction effect.
#
# Source: content/story/factions/README.md (roster, paths, pitches, colours) and
# content/story/world/milestone-effects.md (Huyền Khung Môn → 3 viện, Kim Sa Môn → Kim Sa Giáo).
# Roster status: draft (decision 12) — every name keeps `name_placeholder: true` until the owner approves.
# IDs are permanent once deployed (character_faction.faction_id / faction_history reference them).
#
# Fields
#   allowed_paths   realm path ids; joining converts the character to an allowed path (same tier/stage, F3)
#   open_from_era   era from which players may join; OMITTED = never open (canon not decided yet)
#   close_from_era  era from which nobody may join any more (members stay until an effect moves them)
#   on_close        effect        → a split_faction / migrate_faction effect moves the members (cross-checked)
#                   keep_members  → members stay in the closed faction (no effect decided yet; may still switch out)
#                   split         → when the world era first reaches close_from_era (whichever milestone or event end
#                                   moves it there, even past it), the members are split with the split_faction rules
#                                   (notice, choose window, default = branch with fewest split-placed members, ties in
#                                   the order of this file) into every OTHER faction open in that era that allows all
#                                   of this faction's paths — computed, never listed. Needs ≥ 2 such factions, one of
#                                   them never closing; a branch whose own close era has started takes nobody new.
#   split           on_close: split only: { notice_days, choose_days } (0..30)
#   color           design token suffix: the web uses var(--color-<color>)
#   pitch / motto   display text (≤ 80 chars pitch), copied from the story pages
#
# Rules: one faction per character; a player switch needs `switch_cooldown_seconds` since the last player switch
# (worker/admin moves never touch the cooldown); `fengshen`/admin/event locks block player switches.
# No faction grants any stat (README "Còn nháp").
version: 1

settings:
  switch_cooldown_seconds: 604800   # 7 days between player-initiated switches (checklist 2.2)
  first_join_free: false            # the first join starts the cooldown too: the first switch waits 7 days, so a
                                    # fresh alt can't join and hop into a branch right before a split (review H2)

factions:
  # ── Five starting factions (open_from_era: khai_giang) ───────────────────
  - id: huyen_khung_mon
    name: Huyền Khung Môn
    name_placeholder: true
    allowed_paths: [tien]
    open_from_era: khai_giang
    close_from_era: thanh_nhan        # split into the three viện (milestone thanh_nhan)
    on_close: effect
    color: aura-jade
    motto: Một vòm trời, ba nhánh đạo, cùng về một nguồn.
    pitch: Tông môn dưới núi Tử Tiêu, ba tòa đạo đài chờ ngày phân nhánh.

  - id: kim_sa_mon
    name: Kim Sa Môn
    name_placeholder: true
    allowed_paths: [tien]
    open_from_era: khai_giang
    close_from_era: thanh_nhan        # renamed Kim Sa Giáo (milestone thanh_nhan)
    on_close: effect
    color: aura-golden
    motto: Hạt cát tuy nhỏ, nguyện lực rất dài.
    pitch: Tông môn giữa cát vàng Tây Mạc, tu chậm mà bền, không hỏi xuất thân.

  - id: thuong_lan_dinh
    name: Thương Lan Tiên Đình
    name_placeholder: true
    allowed_paths: [tien]
    open_from_era: khai_giang
    close_from_era: luan_hoi          # cầu sương đứt sau Đại chiến (set by the dai_chien event's on_end)
    on_close: split                   # decisions 2026-11-07: split into the tiên factions still open at luan_hoi
    split: { notice_days: 3, choose_days: 7 }   # decision 9 rules (same as the Huyền Khung split)
    color: spirit-cyan
    motto: Bốn biển một sổ tiên, không ai bị bỏ sót.
    pitch: Triều đình tu sĩ trên đảo nổi biển Đông, giữ Tiên Tịch và lễ nghi.

  - id: tinh_ha_yeu_dinh
    name: Tinh Hà Yêu Đình
    name_placeholder: true
    allowed_paths: [tien]             # ⚠ Yêu path (G3) not decided; tiên for now
    open_from_era: khai_giang
    color: spirit-violet
    motto: Sao trời không hỏi xuất thân.
    pitch: Triều đình Yêu tộc giữa ngân hà, muôn loài tu thành hình đều có sao.

  - id: vu_toc
    name: Vu Tộc
    name_placeholder: true
    allowed_paths: [vu]
    open_from_era: khai_giang
    color: aura-blood
    motto: Máu Bàn Cổ chưa nguội, thân ta tức là pháp bảo.
    pitch: Tộc luyện thể mang máu Bàn Cổ, rèn thân như núi, giữ lời như đá.

  # ── Opened by milestones ──────────────────────────────────────────────────
  # Split of huyen_khung_mon (world_milestones.yaml thanh_nhan). Order here = tie-break order of the default branch.
  - id: thu_nhat_vien
    name: Thủ Nhất Viện
    name_placeholder: true
    allowed_paths: [tien]
    open_from_era: thanh_nhan
    color: jade-300
    pitch: "Giữ một điều cho trọn: tĩnh tu, ít lời, bế quan dài ngày."

  - id: lap_cuc_vien
    name: Lập Cực Viện
    name_placeholder: true
    allowed_paths: [tien]
    open_from_era: thanh_nhan
    color: jade-500
    pitch: "Đạo cần cột mốc: giới luật rõ, truyền thụ có thứ bậc."

  - id: van_luu_vien
    name: Vạn Lưu Viện
    name_placeholder: true
    allowed_paths: [tien]
    open_from_era: thanh_nhan
    color: jade-700
    pitch: "Trăm dòng cùng về biển: mở cửa cho mọi người, mọi xuất thân."

  # Rename of kim_sa_mon (migrate_faction): same disciples, motto and badge, new name.
  - id: kim_sa_giao
    name: Kim Sa Giáo
    name_placeholder: true
    allowed_paths: [tien]
    open_from_era: thanh_nhan
    color: aura-golden
    motto: Hạt cát tuy nhỏ, nguyện lực rất dài.
    pitch: Kim Sa Môn sau khi Song Chủ thành thánh, lời nguyện thành giáo điều.

  # Nhân Tộc opens with Nữ Oa tạo người (era tao_nhan, milestone nu_oa) — decisions 2026-11-07. Still no story page.
  - id: nhan_toc
    name: Nhân Tộc
    name_placeholder: true
    allowed_paths: [tien]
    open_from_era: tao_nhan
    color: aura-earth
