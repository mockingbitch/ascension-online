# Factions (thế lực) — data model §6. Loaded by internal/faction; cross-checked in content.LoadAll against
# realms.yaml paths, world_milestones.yaml eras and every split_faction / migrate_faction effect.
#
# Source: content/story/factions/README.md (roster, paths, pitches, colours) and
# content/story/world/milestone-effects.md (Tam Thanh → Nhân Giáo / Xiển Giáo / Tiệt Giáo, Tây Phương → Tây Phương
# Giáo). Names follow docs/design/cot-truyen.md (owner reversed D2 on 2026-11-07, see docs/decisions.md).
# IDs are permanent once deployed (character_faction.faction_id / faction_history reference them), so the slugs
# below are the legacy stand-in slugs and do NOT spell the display name. Legacy slug → canon name:
#   huyen_khung_mon  → Tam Thanh (Thái Thanh Lão Tử, Nguyên Thủy Thiên Tôn, Thông Thiên Giáo Chủ)
#   kim_sa_mon       → Tây Phương (phe Chuẩn Đề, Tiếp Dẫn)
#   thuong_lan_dinh  → Tiên Đình (Đông Vương Công)
#   tinh_ha_yeu_dinh → Thiên Đình Yêu Tộc (Thiên Đình của Yêu tộc: Đế Tuấn, Thái Nhất)
#   vu_toc           → Vu Tộc (Tổ Vu, máu Bàn Cổ)
#   thu_nhat_vien    → Nhân Giáo (Thái Thanh Lão Tử)
#   lap_cuc_vien     → Xiển Giáo (Nguyên Thủy Thiên Tôn)
#   van_luu_vien     → Tiệt Giáo (Thông Thiên Giáo Chủ)
#   kim_sa_giao      → Tây Phương Giáo (Chuẩn Đề, Tiếp Dẫn)
#   nhan_toc         → Nhân Tộc (Tam Hoàng Ngũ Đế)
#
# Fields
#   allowed_paths   realm path ids; joining converts the character to an allowed path (same tier/stage, F3)
#   open_from_era   era from which players may join; OMITTED = never open (canon not decided yet)
#   close_from_era  era from which nobody may join any more (members stay until an effect moves them)
#   on_close        effect        → a split_faction / migrate_faction effect moves the members (cross-checked)
#                   keep_members  → members stay in the closed faction (no effect decided yet; may still switch out)
#                   split         → when the world era first reaches close_from_era (whichever milestone or event end
#                                   moves it there, even past it), the members are split with the split_faction rules
#                                   (notice, choose window, default = branch with fewest split-placed members, ties in
#                                   the order of this file) into every OTHER faction open in that era that allows all
#                                   of this faction's paths — computed, never listed. Needs ≥ 2 such factions, one of
#                                   them never closing; a branch whose own close era has started takes nobody new.
#   split           on_close: split only: { notice_days, choose_days } (0..30)
#   color           design token suffix: the web uses var(--color-<color>)
#   pitch / motto   display text (≤ 80 chars pitch), copied from the story pages
#
# Rules: one faction per character; a player switch needs `switch_cooldown_seconds` since the last player switch
# (worker/admin moves never touch the cooldown); `fengshen`/admin/event locks block player switches.
# No faction grants any stat (README "Còn nháp").
version: 1

settings:
  switch_cooldown_seconds: 604800   # 7 days between player-initiated switches (checklist 2.2)
  first_join_free: false            # the first join starts the cooldown too: the first switch waits 7 days, so a
                                    # fresh alt can't join and hop into a branch right before a split (review H2)

factions:
  # ── Five starting factions (open_from_era: khai_giang) ───────────────────
  - id: huyen_khung_mon               # = Tam Thanh (legacy slug, see header)
    name: Tam Thanh
    allowed_paths: [tien]
    open_from_era: khai_giang
    close_from_era: thanh_nhan        # Tam Thanh splits into the three giáo (milestone thanh_nhan)
    on_close: effect
    color: aura-jade
    motto: Một khí hóa ba thanh, ba nhánh đạo cùng về một nguồn.
    pitch: Môn hạ Tam Thanh nơi Côn Lôn, nghe đạo Tử Tiêu, chờ ngày phân giáo.

  - id: kim_sa_mon                    # = Tây Phương (legacy slug)
    name: Tây Phương
    allowed_paths: [tien]
    open_from_era: khai_giang
    close_from_era: thanh_nhan        # becomes Tây Phương Giáo (milestone thanh_nhan)
    on_close: effect
    color: aura-golden
    motto: Đất tây tuy cằn, nguyện lực rất dài.
    pitch: Phe Chuẩn Đề nơi Tây phương cằn cỗi, tu chậm mà bền, không hỏi xuất thân.

  - id: thuong_lan_dinh               # = Tiên Đình (legacy slug)
    name: Tiên Đình
    allowed_paths: [tien]
    open_from_era: khai_giang
    close_from_era: luan_hoi          # Tiên Đình tan sau Đại chiến Vu Yêu (set by the dai_chien event's on_end)
    on_close: split                   # decisions 2026-11-07: split into the tiên factions still open at luan_hoi
    split: { notice_days: 3, choose_days: 7 }   # decision 9 rules (same as the Tam Thanh split)
    color: spirit-cyan
    motto: Bốn biển một sổ tiên, không ai bị bỏ sót.
    pitch: Tiên Đình của Đông Vương Công trên biển Đông, giữ sổ tiên và trọng lễ nghi.

  - id: tinh_ha_yeu_dinh              # = Thiên Đình Yêu Tộc (legacy slug)
    name: Thiên Đình Yêu Tộc
    allowed_paths: [tien]             # ⚠ Yêu path (G3) not decided; tiên for now
    open_from_era: khai_giang
    color: spirit-violet
    motto: Sao trời không hỏi xuất thân.
    pitch: Thiên Đình của Yêu tộc trên chín tầng trời, Đế Tuấn và Thái Nhất cầm đầu.

  - id: vu_toc
    name: Vu Tộc
    allowed_paths: [vu]
    open_from_era: khai_giang
    color: aura-blood
    motto: Máu Bàn Cổ chưa nguội, thân ta tức là pháp bảo.
    pitch: Tộc luyện thể do tinh huyết Bàn Cổ hóa thành, Tổ Vu cầm đầu, rèn thân như núi.

  # ── Opened by milestones ──────────────────────────────────────────────────
  # Split of huyen_khung_mon / Tam Thanh (world_milestones.yaml thanh_nhan). Order here = tie-break order of the
  # default branch.
  - id: thu_nhat_vien                 # = Nhân Giáo (legacy slug)
    name: Nhân Giáo
    allowed_paths: [tien]
    open_from_era: thanh_nhan
    color: jade-300
    pitch: "Giáo của Thái Thanh Lão Tử: thanh tĩnh vô vi, ít lời, bế quan dài ngày."

  - id: lap_cuc_vien                  # = Xiển Giáo (legacy slug)
    name: Xiển Giáo
    allowed_paths: [tien]
    open_from_era: thanh_nhan
    color: jade-500
    pitch: "Giáo của Nguyên Thủy Thiên Tôn: giới luật rõ, truyền thụ có thứ bậc."

  - id: van_luu_vien                  # = Tiệt Giáo (legacy slug)
    name: Tiệt Giáo
    allowed_paths: [tien]
    open_from_era: thanh_nhan
    color: jade-700
    pitch: "Giáo của Thông Thiên Giáo Chủ: hữu giáo vô loại, mở cửa cho mọi xuất thân."

  # Rename of kim_sa_mon (migrate_faction): same disciples, motto and badge, new name.
  - id: kim_sa_giao                   # = Tây Phương Giáo (legacy slug)
    name: Tây Phương Giáo
    allowed_paths: [tien]
    open_from_era: thanh_nhan
    color: aura-golden
    motto: Đất tây tuy cằn, nguyện lực rất dài.
    pitch: Phe Chuẩn Đề sau khi Chuẩn Đề và Tiếp Dẫn thành thánh, lập giáo ở Tây phương.

  # Nhân Tộc opens with Nữ Oa tạo người (era tao_nhan, milestone nu_oa) — decisions 2026-11-07.
  - id: nhan_toc
    name: Nhân Tộc
    allowed_paths: [tien]
    open_from_era: tao_nhan
    color: aura-earth
    pitch: Nhân tộc do Nữ Oa nặn từ đất, Tam Hoàng Ngũ Đế dẫn dắt.
