# Appearances (decisions 2026-11-09 "Ngoại hình, hướng dẫn viên…", GĐ-A; "Bộ trang phục vẽ sẵn…"): the body a player
# picks, one of its painted outfits (robe colour + hair accessory baked into the art) and the meditation pose. Loaded by internal/appearance; cross-checked in content.LoadAll (paths).
#
# DISPLAY ONLY. A look never changes cultivation rate, points, breakthrough/tribulation odds, ranking, merit, the
# 150-point daily ceiling or điểm duyên. The loader REJECTS every field not listed below, with a dedicated message for
# effect-like keys (`*_bp`, `*_milli`, `*_hours`, `*_seconds`, `*_points`, every items.yaml effect key).
#
# IDs are permanent ASCII slugs (character_appearance.body_id / hair_id / robe_palette_id / pose_id store them).
# Art slots (web): default outfit = characters/<body_id>/{avatar,meditate[-<pose>],listener,body-b<fx tier>}; every other
# outfit = characters/<body_id>/<outfit_id>/{same names} — see apps/web/src/lib/assets/art/README.md. Missing outfit art
# falls back to the body's default-outfit art, then to the parameterised SVG CultivatorFigure (`sex`, `path`, `svg_hair`,
# `beard` + the outfit's hair accessory and robe colour).
#
# bodies
#   path          realms.yaml path id; a body is only wearable on its path
#   sex           nam | nu (silhouette of the SVG fallback; art direction)
#   pair          body of the SAME sex on the OTHER path: shown automatically when the character's path changes
#                 (tiên ↔ Vu after a faction move), which also grants one body re-pick without cooldown (decision #4)
#   svg_hair      hairstyle of the SVG fallback (the hairstyle is part of the body, decision #5)
#   default_outfit / default_pose   shown until the player picks one (default_outfit is one of `outfits`)
#   outfits       exactly 3 painted outfits (decision "Bộ trang phục vẽ sẵn"): id (unique across ALL bodies, permanent),
#                 name, robe_palette + hair_accessory (allowed on the body's path; robe colours distinct within a body so
#                 even the SVG fallback differs), art (one-line English art brief for the image model: fabric/cut/trim;
#                 female bodies other than the guide keep the modest rule — closed collar, fully covering).
#                 The DB stores the outfit as its (hair_id, robe_palette_id) pair, so an outfit's two parts are as
#                 permanent as its id: re-colouring an outfit = a new outfit id.
#   temperament, traits   designer text (art prompts, picker caption)
# hair_accessories / robe_palettes: `paths` = where it may be worn. Robe colours are CSS tokens --color-robe-<id>
#   (apps/web/src/app.css; a web test checks every id has one).
# poses: one path each.
# default_free: true = everyone owns it. GĐ-A ships only free looks; earned / linh thạch / Tiên Duyên looks (decision #2)
#   arrive with their unlock source in a later phase, so `default_free: false` is refused for now.
