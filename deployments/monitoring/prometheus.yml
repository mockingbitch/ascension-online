# Prometheus for the docker-compose `monitoring` profile. Targets are the internal metrics listeners
# (METRICS_ADDR) of api (:9090) and worker (:9091) on the compose network; neither is published or routed by nginx.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9090"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
