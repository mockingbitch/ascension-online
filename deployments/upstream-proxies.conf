# Extra proxies the container nginx trusts to set the client IP (via CF-Connecting-IP), besides Cloudflare.
# Included by nginx.conf; mounted by docker-compose.yml.
#
# Enable ONLY when a host nginx sits in front of the stack (deployments/host-nginx/tiendao.conf.example) AND the
# container port is bound to loopback (HTTP_BIND=127.0.0.1 in .env). The host proxy reaches the container through the
# Docker bridge, so its address is the bridge gateway; trusting that range lets the host proxy pass the real client IP.
# With the port published on 0.0.0.0 this is still not spoofable from outside (external traffic keeps its own source
# address), but keep the loopback bind + firewall anyway.
#
# set_real_ip_from 172.16.0.0/12;
# set_real_ip_from 192.168.0.0/16;
