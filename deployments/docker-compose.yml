# Local/dev stack (GDD §25). Run `make up` from the repo root; app at http://localhost:2000
name: tiendao

x-game-env: &game-env
  APP_ENV: dev
  DATABASE_URL: postgres://tiendao:tiendao@postgres:5432/tiendao?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  CONTENT_DIR: /app/content/catalog
  STORY_DIR: /app/content/story
  AUTH_DEV_HEADER: ${AUTH_DEV_HEADER:-true}   # X-Dev-User-Id impersonation: set false on any server reachable from outside
  TRUST_PROXY: "true"                       # behind our Nginx
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}   # empty in dev = loopback + private ranges
  NETSIG_SALTS: ${NETSIG_SALTS:-}           # empty in dev = fixed non-secret salt
  PAYMENT_SANDBOX_SECRET: ${PAYMENT_SANDBOX_SECRET:-}   # empty in dev = random per process
  PUBLIC_BASE_URL: ${STACK_BASE_URL:-http://localhost:2000}   # public URL of the stack (domain in prod; host-nginx example)
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}   # from repo-root .env (compose --env-file)
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  JWT_SECRET: ${JWT_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tiendao
      POSTGRES_PASSWORD: tiendao
      POSTGRES_DB: tiendao
    ports: ["2432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiendao"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports: ["2379:6379"]

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on: { postgres: { condition: service_healthy } }
    volumes: [../services/game/migrations:/migrations:ro]
    command: ["-path=/migrations", "-database=postgres://tiendao:tiendao@postgres:5432/tiendao?sslmode=disable", "up"]

  api:
    build: { context: .., dockerfile: deployments/game.Dockerfile }
    command: ["/app/api"]
    environment: *game-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    ports: ["127.0.0.1:2080:8080"]           # loopback only: remote hosts reach the API through nginx (review M1)
    expose: ["9090"]                          # /metrics (METRICS_ADDR) — internal network only, never published

  worker:
    build: { context: .., dockerfile: deployments/game.Dockerfile }
    command: ["/app/worker"]
    environment: *game-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["9091"]                          # /metrics (METRICS_ADDR) — internal network only

  web:
    build: { context: ../apps/web, dockerfile: ../../deployments/web.Dockerfile }
    environment:
      ORIGIN: ${STACK_BASE_URL:-http://localhost:2000}
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro   # real-IP ranges (review H2)
      - ./upstream-proxies.conf:/etc/nginx/upstream-proxies.conf:ro   # host proxy in front (host-nginx example)
    ports: ["${HTTP_BIND:-0.0.0.0}:2000:80"]   # HTTP_BIND=127.0.0.1 when a host nginx proxies a domain here
    depends_on: [web, api]

  # ───── monitoring (optional profile): docker compose --profile monitoring up -d — see deployments/README.md ─────
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:2090:9090"]          # localhost only (ssh tunnel in prod)

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    ports: ["127.0.0.1:2001:3000"]          # localhost only

volumes:
  pgdata:
  promdata:
  grafanadata:
