# TLS is terminated upstream (Cloudflare) in prod; add `listen 443 ssl` here otherwise.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    client_max_body_size 1m;

    # Behind Cloudflare every TCP peer is a CF edge: take the real client from CF-Connecting-IP, but ONLY when the peer
    # is a Cloudflare range (cloudflare-ips.conf). $remote_addr is then the real client and is what the API receives in
    # X-Forwarded-For (the API honours XFF only from TRUSTED_PROXY_CIDRS). Firewall the origin to Cloudflare (README).
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Re-resolve container names via Docker's DNS so a recreated api/web container (new IP)
    # doesn't leave nginx proxying to a dead address (502) until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:3000;

    # Metrics are served on internal ports only (api :9090, worker :9091); never expose them here.
    location = /metrics { return 404; }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket — selective live features only (announcements, sect chat). GDD §23
    location /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;   # per-IP WS connect limit sees the client, not nginx
        proxy_read_timeout 75s;
    }

    location / {
        # SvelteKit (adapter-node) sends a `Link` preload header listing every module of the route;
        # with nested game screens it outgrows nginx's default 4–8k header buffer → "upstream sent too big header" (502).
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
