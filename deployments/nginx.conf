# TLS is terminated upstream (Cloudflare) in prod; add `listen 443 ssl` here otherwise.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    client_max_body_size 1m;

    # Re-resolve container names via Docker's DNS so a recreated api/web container (new IP)
    # doesn't leave nginx proxying to a dead address (502) until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:3000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket — selective live features only (announcements, sect chat). GDD §23
    location /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
