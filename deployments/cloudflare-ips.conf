# Cloudflare edge ranges for nginx real-IP (review H2). Included by nginx.conf; mounted by docker-compose.yml.
# Only requests whose direct peer is in these ranges may set the client IP via CF-Connecting-IP; anyone else keeps
# their own address. Refresh from https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6, e.g.:
#   { curl -s https://www.cloudflare.com/ips-v4; echo; curl -s https://www.cloudflare.com/ips-v6; } \
#     | sed '/^$/d; s/.*/set_real_ip_from &;/' > deployments/cloudflare-ips.conf.new   # then review + replace + reload
