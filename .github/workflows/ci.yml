name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/game } }
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-go@v5
        with: { go-version-file: services/game/go.mod, cache-dependency-path: services/game/go.sum }
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: sqlc generated code is up to date
        run: docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:1.29.0 diff

  integration:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/game } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: tiendao, POSTGRES_PASSWORD: tiendao, POSTGRES_DB: tiendao }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tiendao" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://tiendao:tiendao@localhost:5432/tiendao?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-go@v5
        with: { go-version-file: services/game/go.mod, cache-dependency-path: services/game/go.sum }
      - run: go test -tags integration -race -count=1 ./...
      - name: balance report
        run: go run ./cmd/balancesim -runs 100 >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
